<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — CogniX Algo</title>

  <style>
    /* ──────────────────────────────────────────────────────────────
       1. THEME VARIABLES (matches dashboard)
       ────────────────────────────────────────────────────────────── */
    :root, [data-theme="dark"] {
      --bg-base: #05080f;
      --bg-card: rgba(10, 16, 30, 0.75);
      --border-color: rgba(255, 255, 255, 0.15);
      --border-glow: rgba(255, 0, 200, 0.7);
      --text-main: #f0f4ff;
      --text-muted: #a0b4d0;
      --input-bg: rgba(8, 12, 28, 0.9);
      --input-border: rgba(180, 80, 255, 0.4);

      --brand-gradient: linear-gradient(135deg, #00f0ff 0%, #7b2ffc 40%, #ff2d95 70%, #ffb300 100%);

      --orb-1: rgba(0, 240, 255, 0.45);
      --orb-2: rgba(255, 45, 149, 0.40);
      --orb-3: rgba(123, 47, 252, 0.50);
    }

    /* ──────────────────────────────────────────────────────────────
       2. ANIMATIONS (same as dashboard)
       ────────────────────────────────────────────────────────────── */
    @keyframes ambientGlow {
      0%   { transform: translate(0,0) scale(1) rotate(0deg); }
      25%  { transform: translate(60px,-80px) scale(1.2) rotate(10deg); }
      50%  { transform: translate(-40px,40px) scale(0.9) rotate(-5deg); }
      75%  { transform: translate(30px,-30px) scale(1.1) rotate(5deg); }
      100% { transform: translate(0,0) scale(1) rotate(0deg); }
    }

    @keyframes borderPulse {
      0%, 100% { border-color: var(--border-color); box-shadow: 0 0 8px rgba(255,0,200,0); }
      50%      { border-color: var(--border-glow); box-shadow: 0 0 25px rgba(255,0,200,0.3); }
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-8px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ──────────────────────────────────────────────────────────────
       3. BASE & BACKGROUND (three animated orbs)
       ────────────────────────────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after,
    .orb-extra {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      animation: ambientGlow 22s infinite ease-in-out;
    }

    body::before {
      background: radial-gradient(circle, var(--orb-1) 0%, var(--orb-3) 50%, transparent 70%);
      width: 800px;
      height: 800px;
      top: -200px;
      left: -200px;
      animation-delay: 0s;
    }

    body::after {
      background: radial-gradient(circle, var(--orb-2) 0%, var(--orb-1) 50%, transparent 70%);
      width: 800px;
      height: 800px;
      bottom: -200px;
      right: -200px;
      animation-delay: -11s;
    }

    .orb-extra {
      background: radial-gradient(circle, var(--orb-3) 0%, var(--orb-2) 50%, transparent 70%);
      width: 600px;
      height: 600px;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      animation-delay: -5s;
      filter: blur(180px);
      opacity: 0.5;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ──────────────────────────────────────────────────────────────
       4. LOGIN WRAPPER & CARD
       ────────────────────────────────────────────────────────────── */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2.5rem 2.2rem 2.8rem;
      box-shadow: 0 12px 48px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: borderPulse 6s infinite;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .login-card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 12px 60px rgba(255,0,200,0.15);
    }

    /* ──────────────────────────────────────────────────────────────
       5. BRAND (visible with gradient)
       ────────────────────────────────────────────────────────────── */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.2rem;
    }

    .brand-mark {
      font-size: 2.2rem;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255,0,200,0.5));
      animation: float 3s ease-in-out infinite;
      line-height: 1;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      filter: drop-shadow(0 2px 10px rgba(123,47,252,0.3));
    }

    .brand-sub {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 0.05rem;
    }

    /* ──────────────────────────────────────────────────────────────
       6. FORM INPUTS
       ────────────────────────────────────────────────────────────── */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-form label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .login-form input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 0.75rem;
      padding: 0.85rem 1.1rem;
      font-size: 1rem;
      font-weight: 450;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      font-family: inherit;
      width: 100%;
    }

    .login-form input::placeholder {
      color: rgba(255,255,255,0.20);
      font-weight: 350;
    }

    .login-form input:focus {
      border-color: #ff2d95;
      background: rgba(255,45,149,0.06);
      box-shadow: 0 0 0 4px rgba(255,45,149,0.12), 0 0 0 1px rgba(255,45,149,0.15) inset;
    }

    .login-form input:hover {
      border-color: rgba(255,255,255,0.2);
    }

    .hidden {
      display: none !important;
    }

    #totpField {
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ──────────────────────────────────────────────────────────────
       7. ERROR MESSAGE
       ────────────────────────────────────────────────────────────── */
    .login-error {
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      font-weight: 450;
      text-align: center;
      background: rgba(255,45,149,0.12);
      border: 1px solid rgba(255,45,149,0.18);
      color: #ff7a8a;
    }

    .login-error.hidden {
      display: none;
    }

    /* ──────────────────────────────────────────────────────────────
       8. SIGN IN BUTTON – UNIFIED STYLE (matches Access Token)
       ────────────────────────────────────────────────────────────── */
    .btn-signin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid var(--input-border);
      border-radius: 1rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0.4rem;
    }

    .btn-signin .btn-text {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-signin .btn-text .arrow {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-signin:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-glow);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(123, 47, 252, 0.2);
    }

    .btn-signin:hover .btn-text .arrow {
      transform: translateX(4px);
    }

    .btn-signin:active {
      transform: translateY(0px) scale(0.98);
    }

    /* ──────────────────────────────────────────────────────────────
       9. FOOTER LINKS
       ────────────────────────────────────────────────────────────── */
    .login-footer {
      margin-top: 1.8rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .login-footer a {
      color: rgba(139,110,255,0.6);
      text-decoration: none;
      transition: color 0.25s ease;
      font-weight: 500;
    }

    .login-footer a:hover {
      color: #8b6eff;
    }

    /* ──────────────────────────────────────────────────────────────
       10. RESPONSIVE
       ────────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem 2.2rem; border-radius: 1.2rem; }
      .brand-title { font-size: 1.25rem; }
      .brand-mark { font-size: 1.8rem; }
      .login-form input { padding: 0.75rem 1rem; font-size: 0.95rem; border-radius: 0.6rem; }
      .btn-signin { padding: 0.8rem 1.5rem; font-size: 0.95rem; border-radius: 0.8rem; }
    }

    @media (max-width: 380px) {
      .login-card { padding: 1.5rem 1.2rem 1.8rem; border-radius: 1rem; }
      .login-brand { gap: 0.7rem; }
      .brand-mark { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="orb-extra"></div>
  <div class="grid-overlay"></div>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-brand">
        <span class="brand-mark">◈</span>
        <div>
          <div class="brand-title">CogniX Algo</div>
          <div class="brand-sub">sign in to continue</div>
        </div>
      </div>

      <form id="loginForm" class="login-form">
        <label>Username
          <input id="username" required autocomplete="username" autofocus placeholder="Enter your username" />
        </label>

        <label>Password
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>

        <label id="totpField" class="hidden">Authenticator Code
          <input id="totp_code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 placeholder="6-digit code" autocomplete="one-time-code" />
        </label>

        <div id="loginError" class="login-error hidden"></div>

        <button type="submit" class="btn-signin">
          <span class="btn-text">
            Sign In
            <span class="arrow">→</span>
          </span>
        </button>
      </form>

      <div class="login-footer">
        <a href="#">Forgot password?</a> &nbsp;·&nbsp; <a href="#">Contact support</a>
      </div>

    </div>
  </div>

  <script src="/static/login.js"></script>

  <script>
    (function() {
      'use strict';

      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const totpField = document.getElementById('totpField');
      const totpInput = document.getElementById('totp_code');

      let totpVisible = false;

      function checkTOTP() {
        const u = username.value.trim();
        const p = password.value.trim();
        const show = (u.length > 0 && p.length >= 4);

        if (show && !totpVisible) {
          totpVisible = true;
          totpField.classList.remove('hidden');
          totpInput.required = true;
        } else if (!show && totpVisible) {
          totpVisible = false;
          totpField.classList.add('hidden');
          totpInput.required = false;
          totpInput.value = '';
        }
      }

      username.addEventListener('input', checkTOTP);
      password.addEventListener('input', checkTOTP);
    })();
  </script>
</body>
</html>
