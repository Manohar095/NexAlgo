      // The pinned bar's spacers get the same content widths as their
      // tables, so the visible thumb covers the same fraction as the body's.
      document.getElementById("ocCallPinInner").style.width = callW + "px";
      document.getElementById("ocPutPinInner").style.width = putW + "px";

      // Leg clicks chart the contract, the same pick the OA panel does.
      document.getElementById("ocBody").querySelectorAll(".oc-cell").forEach(cell => {
        cell.addEventListener("click", () => {
          const side = cell.dataset.side === "ce" ? "ce" : "pe";
          const strike = Number(cell.dataset.strike);
          const row = rows.find(r => r.strike === strike);
          const leg = row && row[side];
          if (!leg || !leg.tsym) return;
          if (leg.token && window.__addChartToken) window.__addChartToken(payload.exchange, leg.tsym, String(leg.token));
          markCharted(payload.exchange, leg.tsym);
          renderChain(ocData); // repaint active ring
          window.__openBrokerSymbol(leg.tsym, payload.exchange);
        });
      });

      // Shared pane pixel width across header/body/pinned bar.
      ocApplyPaneWidths();

      // Scroll sync between the pinned strips, the headers and the side
      // scrollers — per-side guards, so a call drag can never fight a put
      // drag (OpenAlgo `syncing` refs).
      const callSide = document.getElementById("ocCallSide");
      const putSide = document.getElementById("ocPutSide");
      const callPin = document.getElementById("ocCallPin");
      const putPin = document.getElementById("ocPutPin");
      const callHeadPane = document.getElementById("ocCallHeadPane");
      const putHeadPane = document.getElementById("ocPutHeadPane");
      const syncing = { call: false, put: false };
      const wire = (from, targets, side) => from.addEventListener("scroll", () => {
        if (syncing[side]) return;
        syncing[side] = true;
        targets.forEach(t => { t.scrollLeft = from.scrollLeft; });
        syncing[side] = false;
      });
      wire(callSide, [callPin, callHeadPane], "call");
      wire(putSide, [putPin, putHeadPane], "put");
      wire(callPin, [callSide, callHeadPane], "call");
      wire(putPin, [putSide, putHeadPane], "put");
      document.getElementById("ocPinbar").hidden = false;
      callHeadPane.scrollLeft = 0;

      // Put LTP against the strike needs nothing (scrollLeft 0); the call
      // side must open fully scrolled right so ITS LTP meets the strike.
      repinCallScroll();

      // Subscribe the legs so they paint live from market-data frames.
      wireOcLegs(payload);
      updateOcStatus();
    }

    function updatePcrValue() {
      if (!ocData || !ocData.chain) return;
      let ceOi = 0, peOi = 0;
      for (const row of ocData.chain) {
        ceOi += (row.ce && row.ce.oi) || 0;
        peOi += (row.pe && row.pe.oi) || 0;
      }
      document.getElementById("ocPcrLabel").textContent = `PCR(${ocData.chain.length})`;
      const wrap = document.getElementById("ocPcrWrap");
      if (wrap) wrap.title = `Across ${ocData.chain.length} strikes on screen`;
      document.getElementById("ocPcrValue").textContent =
        ceOi > 0 ? (peOi / ceOi).toFixed(2) : "-";
    }

    /* Tri-state spot, OpenAlgo spotDirection: green above the previous
       close, red below it, NEUTRAL when the close is unknown or equal.
       Persistent, never a tick-flash. */
    function paintSpotDirection() {
      const el = document.getElementById("ocSpotValue");
      el.classList.remove("spot-up", "spot-down");
      const ltp = Number(String(el.textContent).replace(/,/g, ""));
      if (!Number.isFinite(ltp) || !(ocSpotPrevClose > 0) || ltp === ocSpotPrevClose) return;
      el.classList.add(ltp > ocSpotPrevClose ? "spot-up" : "spot-down");
    }

    // ---------- chains columns menu -----------------------------------------
    document.getElementById("ocColsBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = document.getElementById("ocColsMenu");
      const open = !menu.hidden;
      closeAllMenus(menu);
      if (open) { menu.hidden = true; return; }
      const frag = document.createDocumentFragment();
      frag.appendChild(Object.assign(document.createElement("div"), { className: "oa-menu-label", textContent: "Columns" }));
      for (const c of OC_COLUMNS) {
        frag.appendChild(buildCheckItem(c.label, ocDisplay.columns.includes(c.id), () => {
          ocDisplay.columns = ocDisplay.columns.includes(c.id)
            ? ocDisplay.columns.filter(x => x !== c.id)
            : [...ocDisplay.columns, c.id];
          saveOcDisplay();
          if (ocData) renderChain(ocData);
        }));
      }
      frag.appendChild(Object.assign(document.createElement("div"), { className: "oa-menu-sep" }));
      frag.appendChild(Object.assign(document.createElement("div"), { className: "oa-menu-label", textContent: "Options" }));
      frag.appendChild(buildCheckItem("OI Bars", ocDisplay.showBars, () => {
        ocDisplay.showBars = !ocDisplay.showBars;
        saveOcDisplay();
        if (ocData) renderChain(ocData);
      }));
      menu.innerHTML = "";
      menu.appendChild(frag);
      menu.hidden = false;
    });

    // ============================================================
    // TAB 3 — ALGO SYMBOLS (algo-hub/AlgoSymbolsPanel.tsx)
    // One card per symbol, three lines:
    //   1. symbol, enable switch, status, actions menu
    //   2. Mode / Qty / Brick / LTP          (heading over value)
    //   3. Last brick / Long-Short / Pending B-S / SL  (heading over value)
    // ============================================================
    const algoRows = new Map(); // id -> merged record (config fields + live status)
    let algoTimer = null;
    let algoBusy = new Set();

    async function refreshAlgoSymbols() {
      try {
        const res = await fetch("/api/symbols");
        const list = await res.json();
        const arr = Array.isArray(list) ? list : [];
        for (const rec of arr) {
          const cfg = rec.config || rec;
          const merged = {
            id: rec.id,
            exchange: cfg.exchange,
            token: String(cfg.token),
            tsym: cfg.trading_symbol,
            name: cfg.strategy_name || cfg.trading_symbol,
            trade_mode: cfg.trade_mode,
            quantity: cfg.quantity,
            brick_size: cfg.brick_size,
            product: cfg.product || "",
            config: cfg,   // full SymbolConfig for the settings dialog
            status: "STOPPED",
            ltp: null, position_qty: null, trend: null, brick: null,
            pending_buy_order_id: null, pending_sell_order_id: null, sl_trigger_price: null,
          };
          if (rec.live_status) Object.assign(merged, rec.live_status);
          algoRows.set(rec.id, merged);
          if (window.__addChartToken) window.__addChartToken(merged.exchange, merged.tsym, merged.token);
        }
        for (const id of [...algoRows.keys()]) {
          if (!arr.some(r => r.id === id)) algoRows.delete(id);
        }
        document.getElementById("algoError").hidden = true;
        renderAlgo();
      } catch (e) {
        const err = document.getElementById("algoError");
        err.textContent = "Could not reach the server";
        err.hidden = false;
      }
    }

    function startAlgoPolling() { stopAlgoPolling(); algoTimer = setInterval(refreshAlgoSymbols, 3000); }
    function stopAlgoPolling() { if (algoTimer) { clearInterval(algoTimer); algoTimer = null; } }

    function algoStatusBadge(r) {
      const running = r.status === "RUNNING";
      if (running) return `<span class="oa-badge run">Running</span>`;
      if (r.status === "ERROR") return `<span class="oa-badge err">Error</span>`;
      if (r.status === "HALTED") return `<span class="oa-badge warn">Halted</span>`;
      return `<span class="oa-badge off">${r.status || "Disabled"}</span>`;
    }

    /** A heading with its value directly underneath (Field). */
    function algoField(label, valueHtml, cls) {
      return `<div class="algo-field">
                <div class="k">${label}</div>
                <div class="v ${cls || ""}">${valueHtml}</div>
              </div>`;
    }

    function renderAlgo() {
      const list = document.getElementById("algoList");
      const entries = [...algoRows.values()];

      // Mode badge across the configured symbols (consolidated trade modes).
      const modes = [...new Set(entries.map(r => r.trade_mode).filter(Boolean))];
      const badge = document.getElementById("algoModeBadge");
      if (modes.length === 1) {
        badge.className = "oa-badge off";
        badge.textContent = modes[0];
      } else if (modes.length > 1) {
        badge.className = "oa-badge warn";
        badge.textContent = "Mixed";
      } else {
        badge.className = "oa-badge off";
        badge.textContent = "Mode —";
      }

      if (!entries.length) {
        list.innerHTML = `<div class="algo-empty">No symbols yet. Use <span style="font-weight:600;">Add symbol</span> to configure one.</div>`;
        return;
      }

      list.innerHTML = entries.map(r => {
        const running = r.status === "RUNNING";
        const isBusy = algoBusy.has(r.id);
        const trendCls = r.trend === 1 ? "up" : r.trend === -1 ? "down" : "";
        const brickText = r.trend === 1 ? `<span class="up">Green</span>` : r.trend === -1 ? `<span class="down">Red</span>` : "-";
        const pos = r.position_qty == null ? "-" : r.position_qty;
        const pendB = r.pending_buy_order_id ? "Buy" : "-";
        const pendS = r.pending_sell_order_id ? "Sell" : "-";
        const sl = r.sl_trigger_price != null ? fmt(r.sl_trigger_price) : "-";
        return `
        <div class="algo-card" data-id="${r.id}">
          <div class="algo-l1">
            <span class="algo-sym" title="${r.exchange}:${r.tsym}" data-chart="1">${r.tsym}</span>
            <button class="oa-switch ${running ? "on" : ""}" data-toggle="1" aria-label="${running ? "Disable" : "Enable"} ${r.tsym}" ${isBusy ? "disabled" : ""}></button>
            <span>${algoStatusBadge(r)}</span>
            <span class="kekku">
              <button class="oa-icon-btn" data-menu="1" aria-label="${r.tsym} actions" style="width:28px;height:28px;">${svg("kebab")}</button>
              <div class="oa-menu" hidden>
                <button class="oa-menu-item" data-act="edit" ${running ? "disabled" : ""}>Edit settings</button>
                <button class="oa-menu-item" data-act="restart">Restart</button>
                <button class="oa-menu-item" data-act="chart">Chart symbol</button>
                <button class="oa-menu-item destructive" data-act="squareoff" ${!running ? "disabled" : ""}>Square off</button>
                <div class="oa-menu-sep"></div>
                <button class="oa-menu-item destructive" data-act="remove">Remove</button>
              </div>
            </span>
          </div>
          <div class="algo-grid" style="grid-template-columns: 1.35fr 0.7fr 0.8fr 1fr;">
            ${algoField("Mode", r.trade_mode || "-")}
            ${algoField("Qty", r.quantity ?? "-")}
            ${algoField("Brick", r.brick_size ?? "-")}
            ${algoField("LTP", r.ltp != null ? fmt(r.ltp) : "-")}
          </div>
          <div class="algo-grid" style="grid-template-columns: 1.1fr 0.85fr 1fr 1fr;">
            ${algoField("Last brick", brickText, trendCls)}
            ${algoField("Position", pos === 0 ? "FLAT" : pos > 0 ? `+${pos}` : String(pos), pos > 0 ? "up" : pos < 0 ? "down" : "")}
            ${algoField("Pending B / S", `${pendB} / ${pendS}`)}
            ${algoField("SL trigger", sl)}
          </div>
        </div>`;
      }).join("");

      list.querySelectorAll(".algo-card").forEach(cardEl => {
        const id = cardEl.dataset.id;
        const r = algoRows.get(id);

        cardEl.querySelector(".algo-sym").addEventListener("click", () => {
          markCharted(r.exchange, r.tsym);
          window.__openBrokerSymbol(r.tsym, r.exchange);
        });

        cardEl.querySelector("[data-toggle]").addEventListener("click", (e) => {
          if (algoBusy.has(id)) return;
          const btn = e.currentTarget;
          const r = algoRows.get(id);
          const enabling = !runningNow(r);
          const go = () => {
            algoBusy.add(id);
            btn.disabled = true;
            fetch(`/api/symbols/${id}/${enabling ? "start" : "stop"}`, { method: "POST" })
              .catch(() => {})
              .finally(() => { algoBusy.delete(id); refreshAlgoSymbols(); });
          };
          // OpenAlgo's position-aware confirms on the switch. This engine
          // only trades real orders (no paper mode), so enabling always
          // confirms; disabling with an open position warns about what is
          // left live at the broker.
          if (enabling) {
            if (!window.confirm(`Enable ${r.tsym}?\nEnabling starts the strategy and it will place real orders as soon as a signal appears.`)) return;
            go();
          } else if ((r.position_qty || 0) !== 0) {
            if (!window.confirm(`Disable ${r.tsym}?\nThis symbol has an open position. Disabling stops the bot but leaves the position and its stop-loss order live at the broker. Use Square off first if you want to flatten.`)) return;
            go();
          } else {
            go();
          }
        });

        const menuBtn = cardEl.querySelector("[data-menu]");
        const menu = cardEl.querySelector(".oa-menu");
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const open = !menu.hidden;
          closeAllMenus(menu);
          menu.hidden = open;
        });
        menu.querySelectorAll(".oa-menu-item[data-act]").forEach(item => {
          item.addEventListener("click", async (e) => {
            e.stopPropagation();
            menu.hidden = true;
            const act = item.dataset.act;
            if (act === "chart") {
              markCharted(r.exchange, r.tsym);
              window.__openBrokerSymbol(r.tsym, r.exchange);
              return;
            }
            if (act === "edit") {
              openAlgoSettings("edit", id);
              return;
            }
            if (act === "remove") {
              if (!window.confirm(`Remove ${r.tsym}? This deletes the symbol and its settings.`)) return;
              algoBusy.add(id);
              await fetch(`/api/symbols/${id}`, { method: "DELETE" }).catch(() => {});
              algoBusy.delete(id);
              refreshAlgoSymbols();
              return;
            }
            if (act === "squareoff") {
              // OpenAlgo's SQUAREOFF confirm, verbatim in meaning.
              if (!window.confirm(`Square off ${r.tsym}?\nCancels all pending entries and stop-loss orders for this symbol and closes the position. Trading for this symbol stays halted until you disable and re-enable it.`)) return;
            }
            if (algoBusy.has(id)) return;
            algoBusy.add(id);
            await fetch(`/api/symbols/${id}/${act}`, { method: "POST" }).catch(() => {});
            algoBusy.delete(id);
            refreshAlgoSymbols();
          });
        });
      });
    }

    function runningNow(r) { return !!r && r.status === "RUNNING"; }

    // ============================================================
    // SYMBOL SETTINGS DIALOG (algo-hub/SymbolSettingsDialog.tsx)
    // Add mode: debounced broker symbol search (POST /api/search-symbols)
    //           → pick fills quantity from the lot size, tick/limit offset
    //           from the contract tick, defaults the name; config saved as
    //           POST /api/symbols {config:{...}}.
    // Edit mode: prefilled from the saved SymbolConfig, PUT /api/symbols/{id}
    //           (the backend stops → recreates → restarts the engine).
    // Fields map 1:1 onto models/symbol_config.py — our engine is fixed
    // brick_size only (OpenAlgo's atr/ltp_pct methods don't exist here).
    // ============================================================
    const escAlgo = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const ALGO_EXCHANGES = ["NSE", "BSE", "NFO", "BFO", "MCX", "CDS", "BCD", "NCO"];

    const ALGO_SECTIONS = [
      { title: "Order", fields: [
        { key: "product_type", label: "Product", kind: "select", options: ["I", "C", "M"], labels: { I: "INTRADAY", C: "CNC", M: "MARGIN" } },
        { key: "quantity", label: "Quantity", kind: "number", hint: "Multiple of the lot size" },
        { key: "trade_mode", label: "Trade mode", kind: "select", options: ["LONG_ONLY", "SHORT_ONLY", "LONG_SHORT"] },
      ]},
      { title: "Renko", fields: [
        { key: "brick_size", label: "Brick size", kind: "number", step: "any", hint: "Fixed brick size (pts)" },
        { key: "green_to_red_rev", label: "Green → Red reversal", kind: "number", hint: "Bricks" },
        { key: "red_to_green_rev", label: "Red → Green reversal", kind: "number", hint: "Bricks" },
      ]},
      { title: "Entries and trailing", fields: [
        { key: "buy_brick_no", label: "BUY brick no", kind: "number", hint: "Green brick, >= 0" },
        { key: "sell_brick_no", label: "SELL brick no", kind: "number", hint: "Red brick, <= 0" },
        { key: "limit_price_buy_brick_no", label: "BUY limit = brick + N", kind: "number" },
        { key: "limit_price_sell_brick_no", label: "SELL limit = brick + N", kind: "number" },
        { key: "entry_trail_brick_number", label: "Entry trail (bricks)", kind: "number", step: "any", hint: "Empty = SL trail" },
        { key: "sl_trail_brick_number", label: "SL trail (bricks)", kind: "number", step: "any" },
      ]},
      { title: "Prices and squareoff", fields: [
        { key: "tick_size", label: "Tick size", kind: "number", step: "any" },
        { key: "limit_offset", label: "SL trigger/limit offset", kind: "number", step: "any", hint: "Empty = tick size" },
        { key: "sl_lmt_buffer", label: "Squareoff limit buffer", kind: "number", step: "any" },
        { key: "squareoff", label: "Squareoff time (IST)", kind: "time" },
      ]},
    ];

    const ALGO_FORM_DEFAULTS = {
      strategy_name: "",
      product_type: "I",
      quantity: "1",
      trade_mode: "LONG_ONLY",
      brick_size: "1",
      green_to_red_rev: "2",
      red_to_green_rev: "2",
      buy_brick_no: "1",
      sell_brick_no: "-1",
      limit_price_buy_brick_no: "3",
      limit_price_sell_brick_no: "3",
      entry_trail_brick_number: "",
      sl_trail_brick_number: "2",
      tick_size: "0.05",
      limit_offset: "",
      sl_lmt_buffer: "0.10",
      squareoff: "15:15",
      autostart: false,
    };

    let algoDlgEditing = null;   // record being edited, null in add mode
    let algoDlgForm = null;
    let algoDlgTimer = null;
    let algoDlgSeq = 0;

    function algoDlgCfgToForm(c) {
      const pad = (n) => String(n).padStart(2, "0");
      return {
        strategy_name: c.strategy_name ?? "",
        product_type: c.product_type ?? "I",
        quantity: String(c.quantity ?? 1),
        trade_mode: c.trade_mode ?? "LONG_ONLY",
        brick_size: String(c.brick_size ?? 1),
        green_to_red_rev: String(c.green_to_red_rev ?? 2),
        red_to_green_rev: String(c.red_to_green_rev ?? 2),
        buy_brick_no: String(c.buy_brick_no ?? 1),
        sell_brick_no: String(c.sell_brick_no ?? -1),
        limit_price_buy_brick_no: String(c.limit_price_buy_brick_no ?? 3),
        limit_price_sell_brick_no: String(c.limit_price_sell_brick_no ?? 3),
        entry_trail_brick_number: c.entry_trail_brick_number == null ? "" : String(c.entry_trail_brick_number),
        sl_trail_brick_number: String(c.sl_trail_brick_number ?? 2),
        tick_size: String(c.tick_size ?? 0.05),
        limit_offset: c.limit_offset == null ? "" : String(c.limit_offset),
        sl_lmt_buffer: String(c.sl_lmt_buffer ?? 0.10),
        squareoff: `${pad(c.squareoff_hour ?? 15)}:${pad(c.squareoff_minute ?? 15)}`,
        autostart: !!c.autostart,
      };
    }

    function openAlgoSettings(mode, id) {
      const rec = mode === "edit" && id ? algoRows.get(id) : null;
      algoDlgEditing = rec || null;
      algoDlgForm = rec
        ? algoDlgCfgToForm(rec.config || {})
        : Object.assign({}, ALGO_FORM_DEFAULTS);

      const editing = !!rec;
      const cfg = rec ? (rec.config || {}) : null;
      // Title / description / save (OpenAlgo's strings).
      document.getElementById("algoDlgTitle").textContent = editing ? `Edit ${rec.tsym || cfg.trading_symbol}` : "Add symbol for trade";
      document.getElementById("algoDlgDesc").textContent = editing
        ? "Settings apply the next time this symbol is enabled."
        : "Search the symbol master, then set this symbol's own configuration.";
      document.getElementById("algoDlgSave").textContent = editing ? "Save settings" : "Add symbol";

      // Exchange selector (add mode only, like OpenAlgo)
      const exSel = document.getElementById("algoDlgExchange");
      exSel.innerHTML = ALGO_EXCHANGES.map(x =>
        `<option value="${x}" ${x === String(rec?.config?.exchange ?? "NFO") ? "selected" : ""}>${x}</option>`).join("");
      exSel.disabled = editing;

      // Search row (add) vs fixed symbol row (edit — symbol/exchange are fixed)
      document.getElementById("algoDlgSearch").value = "";
      const resultsBox = document.getElementById("algoDlgResults");
      resultsBox.hidden = true; resultsBox.innerHTML = "";
      const selEl = document.getElementById("algoDlgSelected");
      if (editing) {
        selEl.innerHTML = `Edit settings for <span class="mono">${escAlgo(rec.exchange)}:${escAlgo(rec.tsym || cfg.trading_symbol)}</span>`;
        selEl.hidden = false;
      } else {
        selEl.hidden = true; selEl.innerHTML = "";
      }

      document.getElementById("algoDlgError").hidden = true;
      algoDlgRenderGroups();
      document.getElementById("algoDlgOverlay").hidden = false;
    }

    function algoDlgClose() {
      document.getElementById("algoDlgOverlay").hidden = true;
      algoDlgEditing = null;
      algoDlgForm = null;
      clearTimeout(algoDlgTimer);
    }

    function algoDlgRenderGroups() {
      const wrap = document.getElementById("algoDlgGroups");
      wrap.innerHTML = ALGO_SECTIONS.map(sec => `
        <div class="oa-dlg-section-title">${escAlgo(sec.title)}</div>
        <div class="oa-dlg-fields">
          ${sec.fields.map(f => {
            const hint = f.hint ? `<div class="hint">${f.hint}</div>` : "";
            if (f.kind === "checkbox") {
              return `<label class="oa-dlg-check"><input type="checkbox" data-f="${f.key}" ${algoDlgForm[f.key] ? "checked" : ""} /><span>${f.label}</span></label>`;
            }
            if (f.kind === "select") {
              return `<label class="oa-dlg-field">${f.label}
                <select data-f="${f.key}">${f.options.map(o =>
                  `<option value="${o}" ${algoDlgForm[f.key] === o ? "selected" : ""}>${(f.labels && f.labels[o]) || o}</option>`).join("")}</select>${hint}</label>`;
            }
            const type = f.kind === "time" ? "time" : f.kind === "text" ? "text" : "number";
            return `<label class="oa-dlg-field">${f.label}
              <input type="${type}" data-f="${f.key}" value="${algoDlgForm[f.key] ?? ""}" ${f.step ? `step="${f.step}"` : ""} />${hint}</label>`;
          }).join("")}
        </div>`).join("");

      wrap.querySelectorAll("[data-f]").forEach(el => {
        const key = el.dataset.f;
        const evt = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
        el.addEventListener(evt, () => { algoDlgForm[key] = el.type === "checkbox" ? el.checked : el.value; });
      });
    }

    // ---- debounced broker symbol search (add mode only) ---------------------
    const dlgSearchInput = document.getElementById("algoDlgSearch");
    dlgSearchInput.addEventListener("input", () => {
      clearTimeout(algoDlgTimer);
      algoDlgForm.trading_symbol = "";
      algoDlgForm.token = "";
      const q = dlgSearchInput.value.trim();
      const resBox = document.getElementById("algoDlgResults");
      if (q.length < 2) { resBox.hidden = true; resBox.innerHTML = ""; return; }
      algoDlgTimer = setTimeout(async () => {
        const seq = ++algoDlgSeq;
        const exchange = document.getElementById("algoDlgExchange").value;
        resBox.hidden = false;
        resBox.innerHTML = `<div style="padding:7px 9px;font-size:12px;color:var(--oa-muted-fg);">Searching…</div>`;
        try {
          const r = await fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, exchange }),
          });
          if (seq !== algoDlgSeq) return;
          const d = await r.json();
          const values = (d && d.values) || [];
          if (!values.length) {
            resBox.innerHTML = `<div style="padding:7px 9px;font-size:12px;color:var(--oa-muted-fg);">No matches</div>`;
            return;
          }
          resBox.innerHTML = values.map((v, i) => `
            <button type="button" class="oa-dlg-result" data-i="${i}">
              <span class="mono">${escAlgo(v.tsym)}</span>
              <small>${escAlgo(v.exch || exchange)} · lot ${escAlgo(v.ls ?? "-")} · tick ${escAlgo(v.ti ?? "-")}</small>
            </button>`).join("");
          resBox.querySelectorAll(".oa-dlg-result").forEach(btn => {
            btn.addEventListener("click", () => algoDlgPick(values[Number(btn.dataset.i)], exchange));
          });
        } catch {
          if (seq === algoDlgSeq) { resBox.hidden = true; }
        }
      }, 300);
    });

    function algoDlgPick(v, exchange) {
      algoDlgForm.trading_symbol = v.tsym;
      algoDlgForm.token = String(v.token ?? "");
      algoDlgForm.exchange = v.exch || exchange;
      // Fresh add: contract lot size + broker tick for all price offsets
      // (OpenAlgo fills its strategy defaults the same way), then a display
      // name from the scrip master.
      if (v.ls) algoDlgForm.quantity = String(v.ls);
      if (v.ti) {
        algoDlgForm.tick_size = String(v.ti);
        algoDlgForm.limit_offset = String(v.ti);
      }
      algoDlgForm.strategy_name = v.dname || v.cname || v.tsym;
      const selEl = document.getElementById("algoDlgSelected");
      selEl.innerHTML = `Selected: <span class="mono">${escAlgo(v.exch || exchange)}:${escAlgo(v.tsym)}</span>`;
      selEl.hidden = false;
      const resBox = document.getElementById("algoDlgResults");
      resBox.hidden = true; resBox.innerHTML = "";
      dlgSearchInput.value = "";
      algoDlgRenderGroups();
    }

    // ---- save ----------------------------------------------------------------
    async function algoDlgSubmit() {
      const err = document.getElementById("algoDlgError");
      err.hidden = true;
      const editing = !!algoDlgEditing;
      if (!editing && !algoDlgForm.trading_symbol) {
        err.textContent = "Search and pick a symbol first";
        err.hidden = false;
        return;
      }
      const num = (k, dflt) => { const n = Number(algoDlgForm[k]); return Number.isFinite(n) && String(algoDlgForm[k]).trim() !== "" ? n : dflt; };
      const iint = (k, dflt) => Math.round(num(k, dflt));
      const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
      const sq = String(algoDlgForm.squareoff || "15:15").split(":");
      const cfg = {
        strategy_name: String(algoDlgForm.strategy_name || "").trim() || algoDlgForm.trading_symbol || "Algo",
        exchange: editing ? algoDlgEditing.exchange : algoDlgForm.exchange,
        trading_symbol: editing ? algoDlgEditing.tsym : algoDlgForm.trading_symbol,
        token: editing ? String(algoDlgEditing.token) : String(algoDlgForm.token),
        quantity: Math.max(1, iint("quantity", 1)),
        product_type: algoDlgForm.product_type || "I",
        brick_size: Math.max(0.01, num("brick_size", 1)),
        green_to_red_rev: Math.max(1, iint("green_to_red_rev", 2)),
        red_to_green_rev: Math.max(1, iint("red_to_green_rev", 2)),
        buy_brick_no: iint("buy_brick_no", 1),
        sell_brick_no: iint("sell_brick_no", -1),
        limit_price_buy_brick_no: iint("limit_price_buy_brick_no", 3),
        limit_price_sell_brick_no: iint("limit_price_sell_brick_no", 3),
        tick_size: num("tick_size", 0.05),
        sl_trail_brick_number: num("sl_trail_brick_number", 2),
        entry_trail_brick_number: algoDlgForm.entry_trail_brick_number === "" ? null : num("entry_trail_brick_number", 2),
        limit_offset: algoDlgForm.limit_offset === "" ? null : num("limit_offset", 0.05),
        sl_lmt_buffer: num("sl_lmt_buffer", 0.10),
        trade_mode: algoDlgForm.trade_mode || "LONG_ONLY",
        squareoff_hour: clamp(Math.round(Number(sq[0]) || 15), 0, 23),
        squareoff_minute: clamp(Math.round(Number(sq[1]) || 0), 0, 59),
        autostart: !!algoDlgForm.autostart,
      };
      const btn = document.getElementById("algoDlgSave");
      btn.disabled = true;
      btn.textContent = editing ? "Saving…" : "Adding…";
      try {
        const res = await fetch(editing ? `/api/symbols/${algoDlgEditing.id}` : "/api/symbols", {
          method: editing ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ config: cfg }),
        });
        if (!res.ok) {
          let detail = "";
          try { const d = await res.json(); detail = typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail || d); } catch {}
          throw new Error(detail || `HTTP ${res.status}`);
        }
        algoDlgClose();
        refreshAlgoSymbols();
      } catch (e2) {
        err.textContent = e2.message || "Save failed";
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = editing ? "Save settings" : "Add symbol";
      }
    }

    document.getElementById("algoAddBtn").addEventListener("click", () => openAlgoSettings("add"));
    document.getElementById("algoDashBtn").addEventListener("click", () => window.open("/", "_blank"));
    document.getElementById("algoDlgCancel").addEventListener("click", algoDlgClose);
    document.getElementById("algoDlgClose").addEventListener("click", algoDlgClose);
    document.getElementById("algoDlgSave").addEventListener("click", algoDlgSubmit);
    document.getElementById("algoDlgOverlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) algoDlgClose();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !document.getElementById("algoDlgOverlay").hidden) algoDlgClose();
    });

    document.getElementById("algoRefreshBtn").addEventListener("click", () => refreshAlgoSymbols());
    document.getElementById("algoChartFocusBtn").addEventListener("click", () => refreshAlgoSymbols());

    // Live status patches from ws: {"type":"status","instance_id":..,"status":{...}}
    function updateAlgoFromStatus(msg) {
      if (!algoRows.has(msg.instance_id)) return;
      const merged = Object.assign({}, algoRows.get(msg.instance_id), msg.status || {});
      algoRows.set(msg.instance_id, merged);
      renderAlgo();
    }

    // ---------- page tick router (market_data frames from the module) -------
    // md looks like {exchange, token, feed, data:{ltp, prev_close, volume,
    // open, high, low, bid, ask, oi, ...}} — the OpenAlgo-normalized
    // market-data payload. Legacy flat ticks are converted by the module
    // before they reach here.
    window.__pageTick = (md) => {
      updateWatchlistTick(md);
      const d = md.data || {};
      const ltp = d.ltp != null ? Number(d.ltp) : null;
      if (ocLiveKey && `${md.exchange}|${md.token}` === ocLiveKey) {
        // The underlying's feed carries its previous close — the tri-state
        // anchor. The spot text itself moves with every frame.
        if (d.prev_close != null && Number(d.prev_close) > 0) {
          ocSpotPrevClose = Number(d.prev_close);
        }
        if (ltp) {
          const el = document.getElementById("ocSpotValue");
          el.textContent = fmt(ltp);
          paintSpotDirection();
        }
      }
      paintOcLegs(md); // live option-chain legs (no-op when token not a leg)
    };
    window.__pageStatus = updateAlgoFromStatus;
    // ============================================================
    // THEME TOGGLE
    // ============================================================
    const themeSelect = document.getElementById("themeSelect");
    const savedTheme = localStorage.getItem("cognix_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeSelect.value = savedTheme;

    themeSelect.addEventListener("change", (e) => {
      const selected = e.target.value;
      document.documentElement.setAttribute("data-theme", selected);
      localStorage.setItem("cognix_theme", selected);
      if (window.__brokerSetTheme) window.__brokerSetTheme(selected);
    });

    // ============================================================
    // INIT
    // ============================================================
    // openPanel is a toggle (OpenAlgo behaviour), so clear the remembered
    // id before restoring — otherwise the boot would immediately "close" it.
    const restorePanel = activePanel;
    activePanel = null;
    if (restorePanel) openPanel(restorePanel);
    seedWatchlistFromPlatform().then(() => { if (!wlItems.length) renderWatchlist(); });
    renderWatchlist();
  </script>

  <!-- ============================================================
  BROKER TERMINAL — openalgo-charts + live Noren feed
  ============================================================ -->
  <script type="module">
    import {
      registerInterval,
      withBarCache,
    } from "/static/vendor/openalgo-charts/openalgo-charts.mjs";
    import "/static/vendor/openalgo-charts/openalgo-charts.indicators.mjs";
    import "/static/vendor/openalgo-charts/openalgo-charts.transform.mjs";
    import { createWidget } from "/static/vendor/openalgo-charts/openalgo-charts.widget.mjs";

    // ----------------------------------------------------------
    // Interval registry — codes the Noren TPSeries can serve
    // ----------------------------------------------------------
    const INTERVAL_SECONDS = { "1m": 60, "3m": 180, "5m": 300, "10m": 600, "15m": 900, "30m": 1800, "1h": 3600, "2h": 7200, "4h": 14400 };
    const NOREN_INTRV = { "1m": 1, "3m": 3, "5m": 5, "10m": 10, "15m": 15, "30m": 30, "1h": 60, "2h": 120, "4h": 240 };
    for (const [code, sec] of Object.entries(INTERVAL_SECONDS)) {
      try { registerInterval({ code, bucketing: { mode: "interval", seconds: sec } }); } catch (e) { /* already registered */ }
    }

    // ----------------------------------------------------------
    // Symbol → token resolution
    // ----------------------------------------------------------
    const tokenMap = new Map(); // "EXCH:SYMBOL" -> token
    tokenMap.set("NSE:NIFTY", "26000");       // Noren index tokens, always valid
    tokenMap.set("NSE:BANKNIFTY", "26009");
    tokenMap.set("BSE:SENSEX", "4172");

    window.__registerChartTokens = function (symbols) {
      for (const s of symbols || []) {
        const cfg = s.config || s;
        if (cfg.exchange && cfg.token) {
          tokenMap.set(`${cfg.exchange}:${cfg.trading_symbol}`, String(cfg.token));
        }
      }
    };

    // Page hooks (right panel tabs) to pre-resolve tokens without search
    window.__addChartToken = function (exchange, tsym, token) {
      if (!exchange || !tsym || !token) return;
      tokenMap.set(`${String(exchange).toUpperCase()}:${String(tsym).toUpperCase()}`, String(token));
    };

    async function resolveToken(exchange, symbol) {
      const k = `${String(exchange || "").toUpperCase()}:${String(symbol).toUpperCase()}`;
      if (tokenMap.has(k)) return tokenMap.get(k);
      for (const exchFallback of ["NSE", "NFO", "BFO", "MCX"]) {
        try {
          const res = await fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: symbol, exchange: exchFallback }),
          });
          const payload = await res.json();
          const values = (payload && payload.values) || [];
          const exact = values.find(v => (v.tsym || v.ts || "").toUpperCase() === String(symbol).toUpperCase());
          const v = exact || (values.length === 1 ? values[0] : null);
          if (v) {
            const tok = String(v.token);
            tokenMap.set(`${(v.exch || exchange).toUpperCase()}:${String(v.tsym || v.ts).toUpperCase()}`, tok);
            return tok;
          }
        } catch (e) { /* try the next exchange */ }
      }
      throw new Error(`No instrument token found for ${exchange}:${symbol} — is your broker session active?`);
    }

    // ----------------------------------------------------------
    // Live market data over /ws — OpenAlgo market-data client parity
    //   • desired-state subscriptions (mdWanted) replayed on every (re)open
    //   • {"action":"subscribe"/"unsubscribe"} with per-key modes
    //   • heartbeat watchdog: quiet >45s → {"action":"ping"} probes every
    //     5s; ≥60s silence → reconnect (OpenAlgo 45s/5s watchdog)
    //   • REST fallback: while the socket is down, poll /api/multiquotes
    //     every 5s and feed the same handlers (fallback LED semantics)
    // ----------------------------------------------------------
    const liveSubs = new Map();     // "EXCH|TOKEN" -> {intervalSec, onBar, bar, lastDayVol}
    const mdWanted = new Map();     // "EXCH|TOKEN" -> {exchange, token, mode}
    let ws = null;
    let wsRetry = 0;
    let wsLastInbound = Date.now();
    let wsPingTimer = null;
    let ltpFallbackTimer = null;

    function desiredSymbolsList() {
      return [...mdWanted.values()].map(v => ({ exchange: v.exchange, token: v.token }));
    }

    function wsSend(obj) {
      if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
      return false;
    }

    function resubscribeAll() {
      // Market data (desired state — idempotent on reconnect)
      if (mdWanted.size) {
        wsSend({ action: "subscribe", mode: "quote", symbols: desiredSymbolsList() });
      }
      // Account-level order stream (OpenAlgo subscribe_orders)
      wsSend({ action: "subscribe_orders" });
    }

    // Subscribe / unsubscribe helpers shared with the page panels (funnel).
    // Panels call these via window hooks from the classic script.
    function mdSubscribe(exchange, token) {
      const key = `${String(exchange).toUpperCase()}|${String(token)}`;
      const isNew = !mdWanted.has(key);
      mdWanted.set(key, { exchange, token, mode: "quote" });
      if (isNew) wsSend({ action: "subscribe", mode: "quote", symbols: [{ exchange, token }] });
      return key;
    }
    function mdUnsubscribe(exchange, token) {
      const key = `${String(exchange).toUpperCase()}|${String(token)}`;
      const had = mdWanted.delete(key);
      if (had) wsSend({ action: "unsubscribe", symbols: [{ exchange, token }] });
      return key;
    }
    window.__wsSubKey = mdSubscribe;
    window.__wsUnsubKey = mdUnsubscribe;
    // Connection probe for panels — the option-chain status footer's
    // "Not streaming" line reads it every 5s.
    window.__wsConnected = () => !!(ws && ws.readyState === WebSocket.OPEN);

    // ---------- REST LTP fallback (WS down) — OpenAlgo startLtpFallback ----
    function startLtpFallback() {
      if (ltpFallbackTimer) return;
      ltpFallbackTimer = setInterval(async () => {
        const symbols = desiredSymbolsList();
        if (!symbols.length) return;
        try {
          const res = await fetch("/api/multiquotes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symbols }),
          });
          const payload = await res.json();
          for (const q of (payload && payload.quotes) || []) {
            if (q.status !== "success") continue;
            handleMarketData({
              type: "market_data",
              exchange: q.exchange,
              token: q.token,
              feed: "rest",
              data: q,
            });
          }
        } catch (e) { /* next tick retries */ }
      }, 5000);
    }
    function stopLtpFallback() {
      if (ltpFallbackTimer) { clearInterval(ltpFallbackTimer); ltpFallbackTimer = null; }
    }

    // ---------- market-data routing (shared by WS frames + REST fallback) --
    function handleMarketData(md) {
      if (window.__pageTick) window.__pageTick(md); // watchlist / option chain, works panel-open or not
      const key = `${md.exchange}|${md.token}`;
      const sub = liveSubs.get(key);
      if (!sub) return;
      const d = md.data || {};
      const ltp = Number(d.ltp);
      if (!Number.isFinite(ltp) || ltp <= 0) return;

      const ts = d.ts || Math.floor(Date.now() / 1000);
      const bucket = Math.floor(ts / sub.intervalSec) * sub.intervalSec;

      // Day-volume deltas → per-bar volume (feed v is a running total)
      let volDelta = 0;
      if (d.volume != null) {
        if (sub.lastDayVol != null && d.volume > sub.lastDayVol) {
          volDelta = d.volume - sub.lastDayVol;
        }
        sub.lastDayVol = d.volume;
      }

      let bar = sub.bar;
      if (!bar || bar.time !== bucket) {
        // New bucket. seedFrom (the loaded history's last bar) continues
        // the current candle when it matches; otherwise the previous
        // bar's close becomes the opening price for continuity.
        const seed = (!bar && sub.seed && sub.seed.time === bucket) ? sub.seed : null;
        bar = {
          time: bucket,
          open: seed ? seed.open : (bar ? bar.close : ltp),
          high: seed ? Math.max(seed.high, ltp) : ltp,
          low: seed ? Math.min(seed.low, ltp) : ltp,
          close: ltp,
          volume: seed ? seed.volume || 0 : 0,
        };
        sub.bar = bar;
      }
      bar.high = Math.max(bar.high, ltp);
      bar.low = Math.min(bar.low, ltp);
      bar.close = ltp;
      bar.volume = (bar.volume || 0) + volDelta;
      sub.onBar({ ...bar });
    }
    window.__pageMarketData = handleMarketData;

    function destroySocket() {
      if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
      try { ws && ws.close(); } catch (e) {}
      ws = null;
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws`);

      ws.onopen = () => {
        wsRetry = 0;
        wsLastInbound = Date.now();
        stopLtpFallback();
        // OpenAlgo heartbeat watchdog: quiet >45s → action ping every 5s;
        // ≥60s of silence → the socket is a zombie, recycle it.
        if (wsPingTimer) clearInterval(wsPingTimer);
        wsPingTimer = setInterval(() => {
          const quietMs = Date.now() - wsLastInbound;
          if (quietMs >= 60000) { destroySocket(); return; }
          if (quietMs >= 45000) wsSend({ action: "ping" });
        }, 5000);
        resubscribeAll();
      };

      ws.onclose = () => {
        wsRetry = Math.min(wsRetry + 1, 10);
        destroySocket();
        startLtpFallback(); // candle + panel data keep flowing over REST
        setTimeout(connectWS, 1000 * wsRetry);
      };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };

      ws.onmessage = (event) => {
        wsLastInbound = Date.now();
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === "status") {
          // Renko engine status deltas — Algo Symbols panel lives off these
          if (window.__pageStatus) window.__pageStatus(msg);
          return;
        }
        if (msg.type === "subscribe" || msg.type === "subscribe_orders" ||
            msg.type === "pong" || msg.type === "unsubscribe") {
          return; // protocol acks — the watchdog only needs the timestamp
        }
        if (msg.type === "order_update") {
          if (window.refreshAlgoSymbols) window.refreshAlgoSymbols();
          return;
        }
        if (msg.type === "market_data") { handleMarketData(msg); return; }
        if (msg.type === "tick" && window.__pageTick) {
          // legacy shape, kept for safety during rolling restarts
          handleMarketData({
            type: "market_data",
            exchange: msg.exchange,
            token: msg.token,
            feed: "quote",
            data: {
              ltp: msg.ltp,
              ts: msg.ft || undefined,
              volume: msg.day_volume != null ? msg.day_volume : undefined,
              prev_close: msg.prev_close != null ? msg.prev_close : undefined,
            },
          });
        }
      };
    }
    connectWS();

    // ----------------------------------------------------------
    // Custom DataFeed bridging CogniX ⇄ openalgo-charts
    // ----------------------------------------------------------
    class NorenFeed {
      async getBars(req) {
        const token = await resolveToken(req.exchange, req.symbol);
        const params = new URLSearchParams({
          exchange: req.exchange,
          token,
          interval: NOREN_INTRV[req.interval] != null ? req.interval : "5m",
        });
        if (req.to) params.set("to_ts", String(Math.floor(req.to)));
        if (req.from) params.set("from_ts", String(Math.floor(req.from)));

        const res = await fetch(`/api/chart/history?${params.toString()}`);
        if (!res.ok) throw new Error(`History request failed: HTTP ${res.status}`);
        const payload = await res.json();
        if (payload.stat !== "Ok") throw new Error(payload.emsg || "No history returned");

        return payload.bars.map(b => ({
          time: b.time,
          open: b.open, high: b.high, low: b.low, close: b.close,
          ...(b.volume != null ? { volume: b.volume } : {}),
          ...(b.oi != null ? { oi: b.oi } : {}),
        })).sort((a, b) => a.time - b.time);
      }

      async subscribeBars(req, onBar, opts) {
        const token = await resolveToken(req.exchange, req.symbol);
        const key = `${req.exchange}|${token}`;
        const intervalSec = INTERVAL_SECONDS[req.interval] || 300;

        liveSubs.set(key, {
          intervalSec, onBar, bar: null, lastDayVol: null,
          seed: opts && opts.seedFrom ? opts.seedFrom : null,
        });
        // Market data rides the page WebSocket now — same desired-state
        // funnel the watchlist / option chain use (window.__wsSubKey).
        if (window.__wsSubKey) window.__wsSubKey(req.exchange, token);

        return () => { // unsubscribe
          liveSubs.delete(key);
          if (window.__wsUnsubKey) window.__wsUnsubKey(req.exchange, token);
        };
      }

      async searchSymbols({ query }) {
        const q = String(query || "").trim();
        if (!q) return [];
        // Multi-exchange parallel search — no exchange starves the others.
        const SEARCH_EXCHANGES = ["NSE", "NFO", "BFO", "BSE", "MCX", "CDS"];
        const settled = await Promise.allSettled(SEARCH_EXCHANGES.map(exch =>
          fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, exchange: exch }),
          }).then(r => r.json()).then(p => (p && p.values) || [])
        ));
        const seen = new Set();
        const out = [];
        for (const res of settled) {
          const values = res.status === "fulfilled" ? (res.value || []) : [];
          for (const v of values) {
            const symbol = v.tsym || v.ts;
            if (!symbol) continue;
            const vExch = String(v.exch || "").toUpperCase() || "NSE";
            const mapKey = `${vExch}:${String(symbol).toUpperCase()}`;
            if (seen.has(mapKey)) continue;
            seen.add(mapKey);
            tokenMap.set(mapKey, String(v.token));
            const text = (v.cname || v.name || v.text || symbol).toUpperCase();
            let assetClass = "Equity";
            if (v.optt === "CE" || v.optt === "PE") assetClass = "Options";
            else if (text.includes("FUT")) assetClass = "Futures";
            else if (vExch !== "NSE" && vExch !== "BSE") assetClass = "Derivatives";
            out.push({
              symbol,
              exchange: vExch,
              name: v.cname || v.name || symbol,
              assetClass,
            });
          }
        }
        return out.slice(0, 50);
      }
    }

    // ----------------------------------------------------------
    // Widget lifecycle
    // ----------------------------------------------------------
    let brokerWidget = null;
    let brokerWidgetMeta = { symbol: null, exchange: null };

    async function defaultSymbol() {
      try {
        const res = await fetch("/api/symbols");
        const payload = await res.json();
        const symbols = Array.isArray(payload) ? payload : (payload.symbols || []);
        if (symbols.length) {
          const cfg = symbols[0].config || symbols[0];
          return { symbol: cfg.trading_symbol, exchange: cfg.exchange };
        }
      } catch (e) { /* fall through */ }
      return { symbol: "NIFTY", exchange: "NSE" };
    }

    async function createBrokerWidget(opts = {}) {
      const target = document.getElementById("terminal");
      target.innerHTML = "";
      const { symbol, exchange, interval } = opts.symbol ? opts : await defaultSymbol();

      try {
        brokerWidget = createWidget(target, {
          feed: withBarCache(new NorenFeed(), { ttlMs: 60_000 }),
          symbol,
          exchange,
          ...(interval ? { interval } : {}),
          intervals: Object.keys(INTERVAL_SECONDS),
          theme: currentTheme(),
          mobile: "auto",
          persist: true,
        });
        brokerWidgetMeta = { symbol, exchange };
      } catch (e) {
        target.innerHTML =
          `<div class="chart-error"><span style="font-size:28px">⚠️</span>` +
          `<b>Broker terminal failed to load</b><span>${String(e.message || e)}</span>` +
          `<span>Check that the app is logged in to the broker (token valid) and reload.</span></div>`;
        console.error("openalgo-charts widget creation failed:", e);
      }
    }

    window.__openBrokerSymbol = async (symbol, exchange) => {
      if (!symbol) return;
      if (brokerWidget && brokerWidget.setSymbol) {
        try { brokerWidget.setSymbol(symbol, exchange); brokerWidgetMeta = { symbol, exchange }; return; } catch (e) { /* fall through */ }
      }
      if (brokerWidget) { try { brokerWidget.destroy(); } catch (e) {} brokerWidget = null; }
      await createBrokerWidget({ symbol, exchange });
    };

    window.__brokerSetTheme = async (theme) => {
      if (brokerWidget) {
        try { brokerWidget.destroy(); } catch (e) {}
        brokerWidget = null;
      }
      await createBrokerWidget({ interval: null }); // persisted layout+selection restore
    };

    window.__brokerResize = () => { /* the widget observes its container itself */ };

    createBrokerWidget();
    console.log("📈 CogniX charts: openalgo-charts broker terminal booting");
  </script>
