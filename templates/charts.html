  <!-- ============================================================
  BROKER TERMINAL — openalgo-charts + live Noren feed
  ============================================================ -->
  <script type="module">
    import {
      registerInterval,
      withBarCache,
      darkTheme,
      lightTheme,
      ReplayController,
    } from "/static/vendor/openalgo-charts/openalgo-charts.mjs";
    import { createTradeLayer } from "/static/trading/trade_layer.mjs";
    import "/static/vendor/openalgo-charts/openalgo-charts.indicators.mjs";
    import "/static/vendor/openalgo-charts/openalgo-charts.transform.mjs";
    // OpenAlgoNew Trading-page chart internals (ported verbatim, imports
    // pointed at the vendored copy): these self-register OVER the built-in
    // renko / line-break transform entries — the classic constructions whose
    // reversals tile adjacently instead of re-covering / spanning away, and
    // whose bricks each keep one contiguous time slot (adjacent columns).
    import "/static/vendor/openalgo-charts/openalgo-renko-adjacent.mjs";
    import "/static/vendor/openalgo-charts/openalgo-linebreak-adjacent.mjs";
    import { createChartGrid, CHART_GRID_LAYOUTS, CHART_GRID_LAYOUT_NAMES } from "/static/vendor/openalgo-charts/openalgo-charts.widget.mjs";
    import { chromeIcon, chartTypeIcon } from "/static/trading/glyphs.mjs";
    import { CHART_TYPE_GROUPS, CHART_TYPES, isBoxChartType } from "/static/trading/chart_types.mjs";

    const el = (id) => document.getElementById(id);

    // ----------------------------------------------------------
    // Interval registry — codes the Noren brokers can serve. "1d" is
    // served NOT by TPSeries but by the EODChartData endpoint (the
    // backend routes it there; NOREN_INTRV["1d"] only gates the
    // pass-through here). The library natively resolves 1d →
    // {mode:"interval", seconds:86400}; registering is a no-op kept
    // for the entries loop.
    // ----------------------------------------------------------
    const INTERVAL_SECONDS = { "1m": 60, "3m": 180, "5m": 300, "10m": 600, "15m": 900, "30m": 1800, "1h": 3600, "2h": 7200, "4h": 14400, "1d": 86400 };
    const NOREN_INTRV = { "1m": 1, "3m": 3, "5m": 5, "10m": 10, "15m": 15, "30m": 30, "1h": 60, "2h": 120, "4h": 240, "1d": "D" };
    for (const [code, sec] of Object.entries(INTERVAL_SECONDS)) {
      try { registerInterval({ code, bucketing: { mode: "interval", seconds: sec } }); } catch (e) { /* already registered */ }
    }

    // ----------------------------------------------------------
    // Symbol → token resolution
    // ----------------------------------------------------------
    const tokenMap = new Map(); // "EXCH:SYMBOL" -> token
    const tokenTsymMap = new Map(); // "EXCH:SYMBOL" -> scripmaster Tradingsymbol (EODChartData key)
    tokenMap.set("NSE:NIFTY", "26000");       // Noren index tokens, always valid
    tokenMap.set("NSE:BANKNIFTY", "26009");
    tokenMap.set("BSE:SENSEX", "4172");

    window.__registerChartTokens = function (symbols) {
      for (const s of symbols || []) {
        const cfg = s.config || s;
        if (cfg.exchange && cfg.token) {
          const k = `${cfg.exchange}:${cfg.trading_symbol}`;
          tokenMap.set(k, String(cfg.token));
          if (cfg.trading_symbol) tokenTsymMap.set(k, String(cfg.trading_symbol).toUpperCase());
        }
      }
    };

    // Page hooks (right panel tabs) to pre-resolve tokens without search
    window.__addChartToken = function (exchange, tsym, token) {
      if (!exchange || !tsym || !token) return;
      const k = `${String(exchange).toUpperCase()}:${String(tsym).toUpperCase()}`;
      tokenMap.set(k, String(token));
      tokenTsymMap.set(k, String(tsym).toUpperCase());
    };

    // Resolves { token, exchange, tsym } — the exchange is the one the token
    // ACTUALLY belongs to, so the history/WS pairs are always a matching
    // (exchange, token) set. Previously this returned a bare token resolved
    // from a different exchange (search was NSE-first) while the caller kept
    // the requested exchange — e.g. a BSE-listed click resolved an NSE token
    // and the history request went BSE|<NSE-token>, which Noren refuses.
    // tsym (resolved row's Tradingsymbol) rides along for daily history —
    // EODChartData keys on exchange:tsym, not the token.
    async function resolveToken(exchange, symbol) {
      const sym = String(symbol || "").toUpperCase();
      const reqEx = String(exchange || "").toUpperCase();
      const k = `${reqEx}:${sym}`;
      if (tokenMap.has(k)) return { token: tokenMap.get(k), exchange: reqEx, tsym: tokenTsymMap.get(k) || sym };
      // Requested exchange first, then the usual segment chain (BSE added —
      // an exchange the old chain never tried).
      const chain = [...new Set([reqEx || "NSE", "NSE", "NFO", "BFO", "MCX", "BSE"])];
      for (const exchFallback of chain) {
        try {
          const res = await fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: sym, exchange: exchFallback }),
          });
          const payload = await res.json();
          const values = (payload && payload.values) || [];
          const exact = values.find(v => (v.tsym || v.ts || "").toUpperCase() === sym);
          const v = exact || (values.length === 1 ? values[0] : null);
          if (v) {
            const tok = String(v.token);
            const exch = String(v.exch || exchFallback).toUpperCase();
            const tsym = String(v.tsym || v.ts || sym).toUpperCase();
            tokenMap.set(`${exch}:${tsym}`, tok);
            tokenTsymMap.set(`${exch}:${tsym}`, tsym);
            return { token: tok, exchange: exch, tsym };
          }
        } catch (e) { /* try the next exchange */ }
      }
      throw new Error(`No instrument token found for ${exchange}:${symbol} — is your broker session active?`);
    }

    // ----------------------------------------------------------
    // Live market data over /ws — OpenAlgo market-data client parity
    //   • desired-state subscriptions (mdWanted) replayed on every (re)open
    //   • {"action":"subscribe"/"unsubscribe"} with per-key modes
    //   • heartbeat watchdog: quiet >45s → {"action":"ping"} probes every
    //     5s; ≥60s silence → reconnect (OpenAlgo 45s/5s watchdog)
    //   • REST fallback: while the socket is down, poll /api/multiquotes
    //     every 5s and feed the same handlers (fallback LED semantics)
    // ----------------------------------------------------------
    const liveSubs = new Map();     // "EXCH|TOKEN|FID" (per-feed live slot) -> {intervalSec, anchor, onBar, bar, lastDayVol}
    const hubSubs = new Map();      // "EXCH|TOKEN" -> Set<subKey> — fan-out index: one hub key can serve many chart feeds (grid cells share symbols)
    const mdWanted = new Map();     // "EXCH|TOKEN" -> {exchange, token, mode}
    const mdOwners = new Map();     // "EXCH|TOKEN" -> Set<owner> — owner-aware refcounts so two grid cells on the same symbol don't tear each other's feed down
    let ws = null;
    let wsRetry = 0;
    let wsLastInbound = Date.now();
    let wsPingTimer = null;
    let ltpFallbackTimer = null;

    function desiredSymbolsList() {
      return [...mdWanted.values()].map(v => ({ exchange: v.exchange, token: v.token }));
    }

    function wsSend(obj) {
      if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; }
      return false;
    }

    function resubscribeAll() {
      // Market data (desired state — idempotent on reconnect)
      if (mdWanted.size) {
        wsSend({ action: "subscribe", mode: "quote", symbols: desiredSymbolsList() });
      }
      // Account-level order stream (OpenAlgo subscribe_orders)
      wsSend({ action: "subscribe_orders" });
    }

    // Subscribe / unsubscribe helpers shared with the page panels (funnel).
    // Panels call these via window hooks from the classic script. Owner-aware
    // refcounts: the chart grid gives every cell its own feed, so several
    // consumers can want the same EXCH|TOKEN — the broker unsubscribe only
    // goes out when the LAST owner leaves. Callers without an owner share the
    // legacy singleton "panel" slot (panels' old semantics are preserved).
    function mdSubscribe(exchange, token, owner) {
      const key = `${String(exchange).toUpperCase()}|${String(token)}`;
      const ownerId = owner != null ? String(owner) : "panel";
      let owners = mdOwners.get(key);
      if (!owners) { owners = new Set(); mdOwners.set(key, owners); }
      const first = owners.size === 0;
      owners.add(ownerId);
      if (first) {
        const isNew = !mdWanted.has(key);
        mdWanted.set(key, { exchange, token, mode: "quote" });
        if (isNew) wsSend({ action: "subscribe", mode: "quote", symbols: [{ exchange, token }] });
      }
      return key;
    }
    function mdUnsubscribe(exchange, token, owner) {
      const key = `${String(exchange).toUpperCase()}|${String(token)}`;
      const ownerId = owner != null ? String(owner) : "panel";
      const owners = mdOwners.get(key);
      if (owners) {
        owners.delete(ownerId);
        if (!owners.size) mdOwners.delete(key);
        else return key; // another consumer (another grid cell) still wants this key
      }
      const had = mdWanted.delete(key);
      if (had) wsSend({ action: "unsubscribe", symbols: [{ exchange, token }] });
      return key;
    }
    window.__wsSubKey = mdSubscribe;
    window.__wsUnsubKey = mdUnsubscribe;
    // Test/automation introspection of the fan-out state (no UI use)
    window.__mdDebug = () => ({
      wanted: [...mdWanted.keys()],
      owners: Object.fromEntries([...mdOwners].map(([k, v]) => [k, [...v]])),
      subs: [...liveSubs.keys()],
      hubs: Object.fromEntries([...hubSubs].map(([k, v]) => [k, [...v]])),
    });
    // Connection probe for panels — the option-chain status footer's
    // "Not streaming" line reads it every 5s.
    window.__wsConnected = () => !!(ws && ws.readyState === WebSocket.OPEN);

    // ---------- REST LTP fallback (WS down) — OpenAlgo startLtpFallback ----
    function startLtpFallback() {
      if (ltpFallbackTimer) return;
      ltpFallbackTimer = setInterval(async () => {
        const symbols = desiredSymbolsList();
        if (!symbols.length) return;
        try {
          const res = await fetch("/api/multiquotes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symbols }),
          });
          const payload = await res.json();
          for (const q of (payload && payload.quotes) || []) {
            if (q.status !== "success") continue;
            handleMarketData({
              type: "market_data",
              exchange: q.exchange,
              token: q.token,
              feed: "rest",
              data: q,
            });
          }
        } catch (e) { /* next tick retries */ }
      }, 5000);
    }
    function stopLtpFallback() {
      if (ltpFallbackTimer) { clearInterval(ltpFallbackTimer); ltpFallbackTimer = null; }
    }

    // ---------- market-data routing (shared by WS frames + REST fallback) --
    // Fan-out: every chart feed (one per grid cell) registers its own live
    // slot under hubSubs, so ticks build a candle per feed — two cells on the
    // same symbol each keep their own bar state instead of overwriting.
    function handleMarketData(md) {
      if (window.__pageTick) window.__pageTick(md); // watchlist / option chain, works panel-open or not
      feedBandTick(md); // band mark + trade layer (order lines / BuySell buttons)
      const key = `${md.exchange}|${md.token}`;
      const slots = hubSubs.get(key);
      if (!slots) return;
      const d = md.data || {};
      const ltp = Number(d.ltp);
      if (!Number.isFinite(ltp) || ltp <= 0) return;

      const ts = d.ts || Math.floor(Date.now() / 1000);
      for (const slotKey of slots) {
        const sub = liveSubs.get(slotKey);
        if (!sub) continue;
        // Candle formation — session-anchored buckets (OpenAlgo CandleBuilder
        // sessionAnchorSec parity): with no anchor the epoch grid puts the IST
        // 09:15 mid-hour start inside the wrong 1h/2h/4h bucket (09:15 ≡ 900s
        // mod 3600), so the forming hour opened at the wrong price. Anchoring
        // on the loaded history's last bar time (a true Noren bucket start)
        // keeps live buckets on history's grid: the seed continues the current
        // candle and every later bucket lines up with what history would serve.
        let bucket;
        if (Number.isFinite(sub.anchor)) {
          const k = Math.floor((ts - sub.anchor) / sub.intervalSec);
          bucket = sub.anchor + k * sub.intervalSec;
          if (bucket > ts) bucket -= sub.intervalSec; // tick stamped before its bucket start
        } else {
          bucket = Math.floor(ts / sub.intervalSec) * sub.intervalSec;
        }

        // Day-volume deltas → per-bar volume (feed v is a running total)
        let volDelta = 0;
        if (d.volume != null) {
          if (sub.lastDayVol != null && d.volume > sub.lastDayVol) {
            volDelta = d.volume - sub.lastDayVol;
          }
          sub.lastDayVol = d.volume;
        }

        let bar = sub.bar;
        if (!bar || bar.time !== bucket) {
          // New bucket. seedFrom (the loaded history's last bar) continues
          // the current candle when it matches; otherwise the previous
          // bar's close becomes the opening price for continuity.
          const seed = (!bar && sub.seed && sub.seed.time === bucket) ? sub.seed : null;
          bar = {
            time: bucket,
            open: seed ? seed.open : (bar ? bar.close : ltp),
            high: seed ? Math.max(seed.high, ltp) : ltp,
            low: seed ? Math.min(seed.low, ltp) : ltp,
            close: ltp,
            volume: seed ? seed.volume || 0 : 0,
          };
          sub.bar = bar;
        }
        bar.high = Math.max(bar.high, ltp);
        bar.low = Math.min(bar.low, ltp);
        bar.close = ltp;
        bar.volume = (bar.volume || 0) + volDelta;
        sub.onBar({ ...bar });
      }
    }
    window.__pageMarketData = handleMarketData;

    function destroySocket() {
      if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
      try { ws && ws.close(); } catch (e) {}
      ws = null;
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}/ws`);

      ws.onopen = () => {
        wsRetry = 0;
        wsLastInbound = Date.now();
        stopLtpFallback();
        // OpenAlgo heartbeat watchdog: quiet >45s → action ping every 5s;
        // ≥60s of silence → the socket is a zombie, recycle it.
        if (wsPingTimer) clearInterval(wsPingTimer);
        wsPingTimer = setInterval(() => {
          const quietMs = Date.now() - wsLastInbound;
          if (quietMs >= 60000) { destroySocket(); return; }
          if (quietMs >= 45000) wsSend({ action: "ping" });
        }, 5000);
        resubscribeAll();
        // Order frames drive the chart's order lines / trade layer refills.
        // The broker refcount for the order stream is global (BrokerSession),
        // so one action per socket open is enough.
        wsSend({ action: "subscribe_orders" });
      };

      ws.onclose = () => {
        wsRetry = Math.min(wsRetry + 1, 10);
        destroySocket();
        startLtpFallback(); // candle + panel data keep flowing over REST
        setTimeout(connectWS, 1000 * wsRetry);
      };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };

      ws.onmessage = (event) => {
        wsLastInbound = Date.now();
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }
        if (msg.type === "status") {
          // Renko engine status deltas — Algo Symbols panel lives off these
          if (window.__pageStatus) window.__pageStatus(msg);
          return;
        }
        if (msg.type === "subscribe" || msg.type === "subscribe_orders" ||
            msg.type === "pong" || msg.type === "unsubscribe") {
          return; // protocol acks — the watchdog only needs the timestamp
        }
        if (msg.type === "order_update") {
          if (window.refreshAlgoSymbols) window.refreshAlgoSymbols();
          emitOrderUpdate(msg.data); // chart order lines + trade layer refill
          return;
        }
        if (msg.type === "market_data") { handleMarketData(msg); return; }
        if (msg.type === "tick" && window.__pageTick) {
          // legacy shape, kept for safety during rolling restarts
          handleMarketData({
            type: "market_data",
            exchange: msg.exchange,
            token: msg.token,
            feed: "quote",
            data: {
              ltp: msg.ltp,
              ts: msg.ft || undefined,
              volume: msg.day_volume != null ? msg.day_volume : undefined,
              prev_close: msg.prev_close != null ? msg.prev_close : undefined,
            },
          });
        }
      };
    }
    connectWS();

    // ----------------------------------------------------------
    // Custom DataFeed bridging CogniX ⇄ openalgo-charts
    // ----------------------------------------------------------
    let FEED_SEQ = 0; // one id per feed instance — grid cells each own a feed, so same-symbol subscriptions never collide

    class NorenFeed {
      constructor() { this._fid = ++FEED_SEQ; }

      async getBars(req) {
        const resolved = await resolveToken(req.exchange, req.symbol);
        const params = new URLSearchParams({
          exchange: resolved.exchange,
          token: resolved.token,
          interval: NOREN_INTRV[req.interval] != null ? req.interval : "5m",
        });
        if (resolved.tsym) params.set("tsym", resolved.tsym); // daily (EODChartData) keys on this; intraday ignores it
        if (req.to) params.set("to_ts", String(Math.floor(req.to)));
        if (req.from) params.set("from_ts", String(Math.floor(req.from)));

        const res = await fetch(`/api/chart/history?${params.toString()}`);
        if (!res.ok) throw new Error(`History request failed: HTTP ${res.status}`);
        const payload = await res.json();
        if (payload.stat !== "Ok") throw new Error(payload.emsg || "No history returned");

        return payload.bars.map(b => ({
          time: b.time,
          open: b.open, high: b.high, low: b.low, close: b.close,
          ...(b.volume != null ? { volume: b.volume } : {}),
          ...(b.oi != null ? { oi: b.oi } : {}),
        })).sort((a, b) => a.time - b.time);
      }

      async subscribeBars(req, onBar, opts) {
        const resolved = await resolveToken(req.exchange, req.symbol);
        const hubKey = `${resolved.exchange}|${resolved.token}`;
        // Per-feed subKey: every grid cell owns its own feed instance, so two
        // cells subscribing the SAME symbol each get their own live slot
        // (independent anchor/bar/candle state) — ticks fan out through the
        // hubSubs index instead of one subscription overwriting the other.
        const key = `${hubKey}|${this._fid}`;
        const intervalSec = INTERVAL_SECONDS[req.interval] || 300;
        const seed = opts && opts.seedFrom ? opts.seedFrom : null;

        liveSubs.set(key, {
          intervalSec, onBar, bar: null, lastDayVol: null,
          seed: seed || null,
          // sessionAnchorSec parity: the loaded history's last bar anchors the
          // live bucket grid (see handleMarketData).
          anchor: seed && Number.isFinite(seed.time) ? seed.time : null,
        });
        let slots = hubSubs.get(hubKey);
        if (!slots) { slots = new Set(); hubSubs.set(hubKey, slots); }
        slots.add(key);
        // Market data rides the page WebSocket now — same desired-state
        // funnel the watchlist / option chain use (window.__wsSubKey).
        // The subKey acts as the funnel owner, so the broker-side
        // subscription survives until the LAST consumer unsubscribes.
        // Uses the exchange the token actually resolved from (see resolveToken).
        if (window.__wsSubKey) window.__wsSubKey(resolved.exchange, resolved.token, key);

        return () => { // unsubscribe — removes only THIS feed's slot
          liveSubs.delete(key);
          const set = hubSubs.get(hubKey);
          if (set) { set.delete(key); if (!set.size) hubSubs.delete(hubKey); }
          if (window.__wsUnsubKey) window.__wsUnsubKey(resolved.exchange, resolved.token, key);
        };
      }

      async searchSymbols({ query }) {
        const q = String(query || "").trim();
        if (!q) return [];
        // Multi-exchange parallel search — no exchange starves the others.
        const SEARCH_EXCHANGES = ["NSE", "NFO", "BFO", "BSE", "MCX", "CDS"];
        const settled = await Promise.allSettled(SEARCH_EXCHANGES.map(exch =>
          fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q, exchange: exch }),
          }).then(r => r.json()).then(p => (p && p.values) || [])
        ));
        const seen = new Set();
        const out = [];
        for (const res of settled) {
          const values = res.status === "fulfilled" ? (res.value || []) : [];
          for (const v of values) {
            const symbol = v.tsym || v.ts;
            if (!symbol) continue;
            const vExch = String(v.exch || "").toUpperCase() || "NSE";
            const mapKey = `${vExch}:${String(symbol).toUpperCase()}`;
            if (seen.has(mapKey)) continue;
            seen.add(mapKey);
            tokenMap.set(mapKey, String(v.token));
            tokenTsymMap.set(mapKey, String(symbol).toUpperCase());
            const text = (v.cname || v.name || v.text || symbol).toUpperCase();
            let assetClass = "Equity";
            if (v.optt === "CE" || v.optt === "PE") assetClass = "Options";
            else if (text.includes("FUT")) assetClass = "Futures";
            else if (vExch !== "NSE" && vExch !== "BSE") assetClass = "Derivatives";
            out.push({
              symbol,
              exchange: vExch,
              name: v.cname || v.name || symbol,
              assetClass,
            });
          }
        }
        return out.slice(0, 50);
      }
    }

    // ----------------------------------------------------------
    // Chart-grid lifecycle (OpenAlgo-charts multi-chart desk)
    // ----------------------------------------------------------
    let brokerGrid = null;
    let brokerWidgetMeta = { symbol: null, exchange: null };

    async function defaultSymbol() {
      try {
        const res = await fetch("/api/symbols");
        const payload = await res.json();
        const symbols = Array.isArray(payload) ? payload : (payload.symbols || []);
        if (symbols.length) {
          const cfg = symbols[0].config || symbols[0];
          return { symbol: cfg.trading_symbol, exchange: cfg.exchange };
        }
      } catch (e) { /* fall through */ }
      return { symbol: "NIFTY", exchange: "NSE" };
    }

    // OpenAlgo chartTheme parity — the tuned candle pair and the wick colours
    // OpenAlgoNew frontend/src/lib/trading/chartTheme.ts lays over the engine's
    // base theme: up/down bodies, wicks in the body colour (wicks stay visible
    // and match their candle's direction), the last-price tag and buy/sell
    // pills on the same pair. Surfaces (background/grid/axes) keep the engine's
    // own theme, which is what the widget's chrome derives from.
    const CANDLE_PAIRS = {
      dark: { up: "#14b887", down: "#f0525f" },
      light: { up: "#00855d", down: "#d42f34" },
    };

    function chartTheme(modeName) {
      const light = modeName === "light";
      const base = light ? lightTheme : darkTheme;
      const pair = CANDLE_PAIRS[light ? "light" : "dark"];
      return {
        ...base,
        upColor: pair.up,
        downColor: pair.down,
        wickUpColor: pair.up,
        wickDownColor: pair.down,
        lastPriceUp: pair.up,
        lastPriceDown: pair.down,
        lastPriceText: light ? "#ffffff" : base.background,
        buy: pair.up,
        sell: pair.down,
        profit: pair.up,
        loss: pair.down,
      };
    }

    async function createBrokerGrid(opts = {}) {
      const target = document.getElementById("terminal");
      target.innerHTML = "";
      const { symbol, exchange } = opts.symbol ? opts : await defaultSymbol();

      try {
        // One feed PER CELL (factory form): each cell carries its own live
        // subscription state (subKey "EXCH|TOKEN|FID"), so two cells on the
        // same symbol get independent candles instead of colliding.
        brokerGrid = createChartGrid(target, {
          feed: () => withBarCache(new NorenFeed(), { ttlMs: 60_000 }),
          symbol,
          exchange,
          intervals: Object.keys(INTERVAL_SECONDS),
          theme: chartTheme(currentTheme()),
          preset: "1x1",
          persist: "cognix", // own IndexedDB workspace namespace (never touches the old single-widget "state" row)
          // ONE toolbar: the page band above the chart owns every control
          // (symbol, interval, chart type, indicators, alerts, drawings,
          // replay, layouts, links, save, camera, fullscreen, product/qty).
          // The grid's own bar and the cell's topbar repeated exactly those
          // controls INSIDE the plot, so both are off and the chart is
          // full-bleed. `toolbar` is a grid option; `topbar` is a cell widget
          // option (the grid forwards every non-grid option to each cell).
          toolbar: false,
          topbar: false,
          bottombar: true,   // ONE shared bottom bar for the active chart (time range lives only here)
          mobile: "auto",
        });
        brokerWidgetMeta = { symbol, exchange };
        window.__chartGridApi = brokerGrid; // test/automation accessor (setPreset/active/cells/...)
      } catch (e) {
        target.innerHTML =
          `<div class="chart-error"><span style="font-size:28px">⚠️</span>` +
          `<b>Broker terminal failed to load</b><span>${String(e.message || e)}</span>` +
          `<span>Check that the app is logged in to the broker (token valid) and reload.</span></div>`;
        console.error("openalgo-charts grid creation failed:", e);
      }
    }

    window.__openBrokerSymbol = async (symbol, exchange) => {
      if (!symbol) return;
      if (brokerGrid) {
        try {
          const cell = brokerGrid.active();
          if (cell && cell.widget && cell.widget.setSymbol) {
            cell.widget.setSymbol(symbol, exchange);
            brokerWidgetMeta = { symbol, exchange };
            return;
          }
        } catch (e) { /* fall through to a rebuild */ }
      }
      if (brokerGrid) { try { brokerGrid.destroy(); } catch (e) {} brokerGrid = null; }
      await createBrokerGrid({ symbol, exchange });
    };

    window.__brokerSetTheme = async () => {
      if (brokerGrid) {
        try { brokerGrid.setTheme(chartTheme(currentTheme())); return; } catch (e) { /* fall through */ }
      }
      if (brokerGrid) { try { brokerGrid.destroy(); } catch (e) {} brokerGrid = null; }
      await createBrokerGrid({});
    };

    window.__brokerResize = () => { /* the grid observes its container itself */ };

    // ----------------------------------------------------------
    // BAND TOOLBAR — OpenAlgoNew ChartPane band over the widget grid.
    // Every control resolves the ACTIVE cell on each call (a captured
    // widget goes stale the moment the layout/active cell changes) and
    // drives the package's own public API, never the DOM of the chart.
    // ----------------------------------------------------------
    const BAND_FAVORITES = ["1m", "5m", "15m", "1h", "1d"];
    const BAND_KEY = {
      product: "cognix_band_product",
      qty: "cognix_band_qty",
      oneClick: "cognix_band_oneclick",
      layouts: "cognix_band_layouts",
    };

    function activeChart() {
      if (!brokerGrid) return null;
      try {
        const cell = brokerGrid.active();
        return cell && cell.widget ? cell.widget.chart : null;
      } catch { return null; }
    }

    function activeWidget() {
      if (!brokerGrid) return null;
      try {
        const cell = brokerGrid.active();
        return cell && cell.widget ? cell.widget : null;
      } catch { return null; }
    }

    const bandState = {
      symbol: null, exchange: null, tsym: null, token: null,
      tick: null, lotSize: 1, ltp: null,
      qty: Math.max(1, Math.floor(Number(localStorage.getItem(BAND_KEY.qty) || 1) || 1)),
      product: localStorage.getItem(BAND_KEY.product) || "MIS",
      oneClick: localStorage.getItem(BAND_KEY.oneClick) === "1",
    };

    const orderUpdateListeners = new Set();
    function emitOrderUpdate(row) {
      for (const cb of Array.from(orderUpdateListeners)) {
        try { cb(row); } catch { /* consumer */ }
      }
    }

    function toastMsg(msg, kind = "") {
      const host = document.getElementById("tt-toasts") || document.getElementById("toasts");
      if (!host) return;
      const t = document.createElement("div");
      t.className = "tt-toast" + (kind ? ` ${kind}` : "");
      t.textContent = msg;
      host.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    // ---- glyphs (chromeIcons.ts vocabulary, same module as the terminal) --
    function hydrateGlyphs(root) {
      for (const node of (root || document).querySelectorAll("[data-glyph]")) {
        const id = node.getAttribute("data-glyph");
        const size = Number(node.getAttribute("data-glyph-size") || 16);
        let svg = null;
        try { svg = chromeIcon(id, size); } catch { svg = null; }
        if (svg) node.replaceChildren(svg);
      }
    }

    // ---- popover engine: fixed placement, capture-phase dismiss ----------
    let bandPop = null;
    function popNode(id) {
      let node = document.getElementById(id);
      if (!node) {
        node = document.createElement("div");
        node.id = id;
        node.className = "band-pop";
        node.hidden = true;
        document.body.appendChild(node);
      }
      return node;
    }
    function closePops() {
      for (const p of document.querySelectorAll(".band-pop")) p.hidden = true;
      bandPop = null;
    }
    function placePop(pop, anchor) {
      pop.hidden = false;
      const r = anchor.getBoundingClientRect();
      const w = pop.offsetWidth;
      const h = pop.offsetHeight;
      let left = r.left;
      if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
      left = Math.max(8, left);
      let top = r.bottom + 6;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
    }
    function togglePop(id, anchor, build) {
      const pop = popNode(id);
      const wasOpen = bandPop === pop && !pop.hidden;
      closePops();
      if (wasOpen) return;
      pop.replaceChildren();
      build(pop);
      placePop(pop, anchor);
      bandPop = pop;
    }
    document.addEventListener("pointerdown", (e) => {
      if (!bandPop) return;
      if (bandPop.contains(e.target)) return;
      if (e.target.closest && e.target.closest("#band")) return; // the button toggles itself
      closePops();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePops(); });
    window.addEventListener("resize", closePops);
    window.addEventListener("scroll", closePops, true);

    function popItem(label, { active = false, disabled = false, sub = "", icon = null, onClick } = {}) {
      const b = document.createElement("button");
      b.className = "band-pop-item" + (active ? " active" : "");
      b.type = "button";
      if (icon) b.appendChild(icon);
      const span = document.createElement("span");
      span.textContent = label;
      b.appendChild(span);
      if (sub) {
        const s = document.createElement("span");
        s.className = "band-pop-sub";
        s.textContent = sub;
        b.appendChild(s);
      }
      b.disabled = !!disabled;
      if (onClick) b.onclick = onClick;
      return b;
    }
    function popHead(text) {
      const d = document.createElement("div");
      d.className = "band-pop-head";
      d.textContent = text;
      return d;
    }
    function popSep() {
      const d = document.createElement("div");
      d.className = "band-pop-sep";
      return d;
    }

    // ---- band <-> active cell sync ---------------------------------------
    let bandTradeChart = null;
    let bandTradeLayer = null;
    let bandCtxSig = "";

    function productChoices(exchange) {
      const ex = String(exchange || "").toUpperCase();
      const derivative = ["NFO", "BFO", "MCX", "CDS"].includes(ex);
      return derivative ? ["MIS", "NRML"] : ["MIS", "CNC"];
    }

    function paintBand() {
      const w = activeWidget();
      if (!w) return;
      const sym = typeof w.symbol === "function" ? w.symbol() : null;
      const ex = typeof w.exchange === "function" ? w.exchange() : null;
      const iv = typeof w.interval === "function" ? w.interval() : null;
      const ct = typeof w.chartType === "function" ? w.chartType() : "candlestick";

      el("bandSymText").textContent = sym || "—";
      el("bandExBadge").textContent = ex || "—";
      el("bandTfLabel").textContent = iv === "1d" ? "D" : (iv || "—");
      for (const pill of el("bandTfStrip").children) {
        pill.classList.toggle("active", pill.dataset.iv === iv);
      }

      const def = CHART_TYPES[ct] || CHART_TYPES.candlestick;
      el("bandCtypeLabel").textContent = def ? def.label : "Candles";
      const icon = chartTypeIcon(def ? def.iconKey : "chart-candlestick");
      if (icon) {
        icon.style.width = "16px";
        icon.style.height = "16px";
        el("bandCtypeIcon").replaceChildren(icon);
      }
      el("bandBoxSettings").style.display = isBoxChartType(ct) ? "" : "none";

      // Product legality follows the segment (MIS/NRML on derivatives,
      // MIS/CNC on cash) — same rule the terminal band uses.
      const choices = productChoices(ex);
      if (!choices.includes(bandState.product)) {
        bandState.product = choices[0];
        localStorage.setItem(BAND_KEY.product, bandState.product);
      }
      el("bandProduct").textContent = bandState.product;
      el("bandProduct").title = `Order product: ${choices.join(" / ")}`;

      el("bandQty").value = String(bandState.qty);
      el("bandOneClick").setAttribute("aria-pressed", bandState.oneClick ? "true" : "false");
      el("bandOneClickLabel").textContent = bandState.oneClick ? "One-Click on" : "One-Click off";

      if (sym && ex && (sym !== bandState.symbol || ex !== bandState.exchange)) {
        void refreshBandInstrument();
      }
      // setContext() re-reads the books — only when the trade context moved.
      const sig = [bandState.token, bandState.exchange, bandState.product, bandState.qty].join("|");
      if (bandTradeLayer && typeof bandTradeLayer.setContext === "function" && sig !== bandCtxSig) {
        bandCtxSig = sig;
        bandTradeLayer.setContext();
      }
    }

    /** Resolve token / tick / LTP for the band's instrument (the trade
     *  context). The WS only pushes on trades, so seed one quote — the
     *  cheapest place to learn the contract's tick size. */
    async function refreshBandInstrument() {
      const w = activeWidget();
      if (!w) return;
      const sym = typeof w.symbol === "function" ? w.symbol() : null;
      const ex = typeof w.exchange === "function" ? w.exchange() : null;
      if (!sym || !ex) return;
      bandState.symbol = sym;
      bandState.exchange = ex;
      bandState.token = null;
      bandState.tsym = sym;
      bandState.ltp = null;
      try {
        const resolved = await resolveToken(ex, sym);
        bandState.exchange = resolved.exchange || ex;
        bandState.token = String(resolved.token);
        bandState.tsym = resolved.tsym || sym;
      } catch (e) {
        console.warn("band: token resolve failed", e);
      }
      if (!bandState.token) return;
      try {
        const q = await fetch(
          `/api/quotes?exchange=${encodeURIComponent(bandState.exchange)}&token=${encodeURIComponent(bandState.token)}`,
          { method: "POST" }
        ).then((r) => r.json());
        if (q && (q.status === "success" || q.stat === "Ok") && q.data) {
          if (Number(q.data.tick_size) > 0) bandState.tick = Number(q.data.tick_size);
          if (Number(q.data.ltp) > 0) bandState.ltp = Number(q.data.ltp);
        }
      } catch { /* the WS will supply the mark */ }
      if (bandTradeLayer && typeof bandTradeLayer.setContext === "function") bandTradeLayer.setContext();
    }

    function ensureTradeLayer() {
      const chart = activeChart();
      if (!chart || !chart.trading) return;
      if (bandTradeChart === chart && bandTradeLayer) return;
      destroyTradeLayer();
      try {
        bandTradeLayer = createTradeLayer({
          chart,
          socket: {
            onOrderUpdate(cb) {
              orderUpdateListeners.add(cb);
              return () => orderUpdateListeners.delete(cb);
            },
          },
          getContext: () => ({
            symbol: bandState.tsym || bandState.symbol,
            exchange: bandState.exchange,
            token: bandState.token,
            tick: bandState.tick,
            lotSize: 1,
            qty: bandState.qty,
            product: bandState.product,
            tradable: true,
          }),
          onToast: (msg, kind) => toastMsg(msg, kind),
          onQty: () => {
            const q = el("bandQty");
            q.focus();
            q.select();
          },
          onBooks: () => {},
          // One-Click OFF = the canvas BUY/SELL asks before firing.
          onBeforeOrder: (intent) => {
            if (bandState.oneClick) return true;
            const c = intent || {};
            return window.confirm(
              `${c.side} ${c.type} ${c.qty} × ${c.symbol} (${c.product}) — place the order?`
            );
          },
        });
        bandTradeLayer.startPolling(5000);
        if (bandState.ltp && bandState.token) {
          bandTradeLayer.onTick({ token: bandState.token, data: { ltp: bandState.ltp } });
        }
        bandTradeChart = chart;
      } catch (e) {
        console.warn("band: trade layer unavailable", e);
        bandTradeLayer = null;
        bandTradeChart = null;
      }
    }

    function destroyTradeLayer() {
      if (!bandTradeLayer) return;
      try { bandTradeLayer.destroy(); } catch { /* already gone */ }
      bandTradeLayer = null;
      bandTradeChart = null;
    }

    /** Feed the trade layer / band mark from the page's market-data funnel. */
    function feedBandTick(md) {
      if (!md) return;
      const d = md.data || {};
      const key = `${md.exchange}|${md.token}`;
      if (bandState.token && key === `${bandState.exchange}|${bandState.token}`) {
        const px = Number(d.ltp);
        if (px > 0) bandState.ltp = px;
        if (Number(d.tick_size) > 0) bandState.tick = Number(d.tick_size);
      }
      if (bandTradeLayer && typeof bandTradeLayer.onTick === "function") {
        bandTradeLayer.onTick({ token: md.token, exchange: md.exchange, data: d });
      }
    }

    // ---- interval strip + menu -------------------------------------------
    function renderTfStrip() {
      const strip = el("bandTfStrip");
      strip.replaceChildren();
      for (const iv of BAND_FAVORITES) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "band-pill";
        b.dataset.iv = iv;
        b.textContent = iv === "1d" ? "D" : iv;
        b.onclick = () => applyInterval(iv);
        strip.appendChild(b);
      }
    }

    function applyInterval(iv) {
      const w = activeWidget();
      if (!w || !iv) return;
      closePops();
      try {
        w.setInterval(iv);
      } catch (e) {
        toastMsg(`Interval ${iv} failed: ${e.message}`, "err");
      }
      paintBand();
    }

    function buildTfMenu(pop) {
      const w = activeWidget();
      const current = w && typeof w.interval === "function" ? w.interval() : null;
      const groups = [
        ["Minutes", ["1m", "3m", "5m", "10m", "15m", "30m"]],
        ["Hours", ["1h", "2h", "4h"]],
        ["Days", ["1d"]],
      ];
      for (const [head, codes] of groups) {
        pop.appendChild(popHead(head));
        for (const code of codes) {
          pop.appendChild(
            popItem(code === "1d" ? "1 day (D)" : code, {
              active: code === current,
              disabled: !(code in INTERVAL_SECONDS),
              onClick: () => applyInterval(code),
            })
          );
        }
        if (head !== "Days") pop.appendChild(popSep());
      }
    }

    // ---- symbol search ---------------------------------------------------
    const bandSearchCache = new Map();
    async function bandSearch(q) {
      const query = String(q || "").trim();
      if (!query) return [];
      if (bandSearchCache.has(query)) return bandSearchCache.get(query);
      const exchanges = ["NSE", "NFO", "BFO", "BSE", "MCX", "CDS"];
      const settled = await Promise.allSettled(
        exchanges.map((exch) =>
          fetch("/api/search-symbols", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, exchange: exch }),
          })
            .then((r) => r.json())
            .then((p) => (p && p.values) || [])
        )
      );
      const seen = new Set();
      const rows = [];
      for (const res of settled) {
        if (res.status !== "fulfilled") continue;
        for (const v of res.value || []) {
          const symbol = v.tsym || v.ts;
          if (!symbol) continue;
          const exch = String(v.exch || "").toUpperCase();
          const key = `${exch}:${symbol}`;
          if (seen.has(key)) continue;
          seen.add(key);
          rows.push({
            symbol,
            exchange: exch,
            name: v.cname || v.name || symbol,
            token: v.token ? String(v.token) : null,
          });
        }
      }
      rows.sort((a, b) => {
        const au = a.symbol.toUpperCase();
        const bu = b.symbol.toUpperCase();
        const q2 = query.toUpperCase();
        const rank = (s) => (s === q2 ? 0 : s.startsWith(q2) ? 1 : 2);
        return rank(au) - rank(bu) || au.length - bu.length || au.localeCompare(bu);
      });
      const out = rows.slice(0, 40);
      bandSearchCache.set(query, out);
      if (bandSearchCache.size > 60) bandSearchCache.delete(bandSearchCache.keys().next().value);
      return out;
    }

    function buildSymMenu(pop) {
      const head = document.createElement("div");
      head.className = "band-sym-search";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Search symbol…";
      input.value = (activeWidget() && activeWidget().symbol && activeWidget().symbol()) || "";
      input.setAttribute("aria-label", "Search symbol");
      head.appendChild(input);
      pop.appendChild(head);
      const list = document.createElement("div");
      list.className = "band-sym-list";
      pop.appendChild(list);

      let seq = 0;
      const run = async () => {
        const mine = ++seq;
        const q = input.value.trim();
        if (!q) {
          list.replaceChildren();
          const hint = document.createElement("div");
          hint.className = "band-sym-empty";
          hint.textContent = "Type to search NSE / NFO / BFO / BSE / MCX / CDS";
          list.appendChild(hint);
          return;
        }
        const busy = document.createElement("div");
        busy.className = "band-sym-empty";
        busy.textContent = "Searching…";
        list.replaceChildren(busy);
        const rows = await bandSearch(q);
        if (mine !== seq) return;
        list.replaceChildren();
        if (!rows.length) {
          const none = document.createElement("div");
          none.className = "band-sym-empty";
          none.textContent = `No match for “${q}”`;
          list.appendChild(none);
          return;
        }
        for (const row of rows) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "band-sym-row";
          const sym = document.createElement("span");
          sym.textContent = row.symbol;
          const ex = document.createElement("span");
          ex.className = "ex";
          ex.textContent = row.exchange;
          const nm = document.createElement("span");
          nm.className = "nm";
          nm.textContent = row.name;
          b.append(sym, ex, nm);
          b.onclick = () => {
            closePops();
            void switchBandSymbol(row.symbol, row.exchange);
          };
          list.appendChild(b);
        }
      };
      let timer = null;
      input.oninput = () => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => void run(), 220);
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter") {
          const first = list.querySelector(".band-sym-row");
          if (first) first.click();
        }
      };
      setTimeout(() => { input.focus(); input.select(); }, 0);
      void run();
    }

    async function switchBandSymbol(symbol, exchange) {
      const w = activeWidget();
      if (!w || !symbol) return;
      try {
        if (typeof w.setSymbol === "function") w.setSymbol(symbol, exchange);
        else await window.__openBrokerSymbol(symbol, exchange);
      } catch (e) {
        toastMsg(`Symbol switch failed: ${e.message}`, "err");
        return;
      }
      bandState.symbol = null; // force a token re-resolve
      paintBand();
    }

    // ---- chart type + box settings ---------------------------------------
    function buildCtypeMenu(pop) {
      const w = activeWidget();
      const current = w && typeof w.chartType === "function" ? w.chartType() : "candlestick";
      const groups = CHART_TYPE_GROUPS || [];
      groups.forEach((group, gi) => {
        for (const def of group) {
          const icon = chartTypeIcon(def.iconKey);
          if (icon) {
            icon.style.width = "16px";
            icon.style.height = "16px";
          }
          pop.appendChild(
            popItem(def.label, {
              active: def.value === current,
              disabled: !!def.pending,
              icon,
              sub: def.pending ? "profile layer" : "",
              onClick: () => {
                closePops();
                applyChartType(def.value);
              },
            })
          );
        }
        if (gi !== groups.length - 1) pop.appendChild(popSep());
      });
    }

    function applyChartType(value) {
      const w = activeWidget();
      if (!w || !value) return;
      try {
        w.setChartType(value);
      } catch (e) {
        toastMsg(`Chart type failed: ${e.message}`, "err");
      }
      paintBand();
    }

    // ---- product / qty / one-click ---------------------------------------
    function cycleProduct() {
      const w = activeWidget();
      const choices = productChoices(w && w.exchange ? w.exchange() : bandState.exchange);
      const i = choices.indexOf(bandState.product);
      bandState.product = choices[(i + 1) % choices.length];
      localStorage.setItem(BAND_KEY.product, bandState.product);
      if (bandTradeLayer && typeof bandTradeLayer.setContext === "function") bandTradeLayer.setContext();
      paintBand();
      toastMsg(`Order product: ${bandState.product}`, "");
    }

    function setBandQty(value) {
      const n = Math.max(1, Math.floor(Number(value) || 1));
      bandState.qty = n;
      localStorage.setItem(BAND_KEY.qty, String(n));
      el("bandQty").value = String(n);
      if (bandTradeLayer && typeof bandTradeLayer.setContext === "function") bandTradeLayer.setContext();
    }

    function toggleOneClick() {
      bandState.oneClick = !bandState.oneClick;
      localStorage.setItem(BAND_KEY.oneClick, bandState.oneClick ? "1" : "0");
      paintBand();
      toastMsg(
        bandState.oneClick
          ? "One-Click ON — canvas BUY/SELL fires immediately"
          : "One-Click OFF — canvas BUY/SELL asks for confirmation",
        ""
      );
    }

    // ---- drawing tools ---------------------------------------------------
    const BAND_DRAW_TOOLS = [
      ["select", "Select", "cursor"],
      ["trend-line", "Trend line", "line-dashed"],
      ["horizontal-line", "Horizontal line", "line-dotted"],
      ["rectangle", "Rectangle", "chart-area"],
      ["ellipse", "Ellipse", "measure"],
      ["text", "Text", "text"],
      ["measure", "Measure", "measure"],
      ["brush", "Brush", "brush"],
    ];

    function buildDrawMenu(pop) {
      const w = activeWidget();
      const active = w && w.draw && typeof w.draw.activeTool === "function" ? w.draw.activeTool() : null;
      for (const [id, label, iconKey] of BAND_DRAW_TOOLS) {
        const icon = chromeIcon(iconKey, 16);
        pop.appendChild(
          popItem(label, {
            active: id === "select" ? active == null : active === id,
            icon,
            onClick: () => {
              closePops();
              try {
                if (!w || !w.draw) throw new Error("drawing controller unavailable");
                w.draw.setTool(id === "select" ? null : id);
              } catch (e) {
                toastMsg(`Drawing tool failed: ${e.message}`, "err");
              }
            },
          })
        );
      }
      pop.appendChild(popSep());
      pop.appendChild(
        popItem("Undo", {
          onClick: () => {
            closePops();
            try { w && w.draw && w.draw.undo && w.draw.undo(); } catch { /* none */ }
          },
        })
      );
      pop.appendChild(
        popItem("Redo", {
          onClick: () => {
            closePops();
            try { w && w.draw && w.draw.redo && w.draw.redo(); } catch { /* none */ }
          },
        })
      );
      pop.appendChild(
        popItem("Clear all drawings", {
          onClick: () => {
            closePops();
            try {
              if (w && w.draw && w.draw.clear) w.draw.clear();
              else if (w && w.draw && w.draw.removeAll) w.draw.removeAll();
            } catch { /* none */ }
          },
        })
      );
    }

    // ---- replay (package ReplayController) -------------------------------
    let replayCtl = null;
    let replayTimer = null;

    function replayPanel() {
      let panel = document.getElementById("bandReplayPanel");
      if (panel) return panel;
      panel = document.createElement("div");
      panel.id = "bandReplayPanel";
      panel.className = "band-replay";
      panel.hidden = true;
      panel.innerHTML = `
        <button class="band-btn band-sq" id="bandReplayBack" aria-label="Step back"></button>
        <button class="band-btn band-sq" id="bandReplayPlay" aria-label="Play / pause"></button>
        <button class="band-btn band-sq" id="bandReplayStep" aria-label="Step forward"></button>
        <button class="band-btn band-sq" id="bandReplayStop" aria-label="Stop replay"></button>
        <input type="range" id="bandReplayRange" min="0" max="0" value="0" aria-label="Replay position" />
        <span class="band-replay-label" id="bandReplayLabel">—</span>
        <select id="bandReplaySpeed" aria-label="Replay speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>`;
      document.body.appendChild(panel);
      document.getElementById("bandReplayBack").onclick = () => {
        try { replayCtl && replayCtl.stepBack(1); } catch { /* none */ }
        replayPaint();
      };
      document.getElementById("bandReplayStep").onclick = () => {
        try { replayCtl && replayCtl.step(1); } catch { /* none */ }
        replayPaint();
      };
      document.getElementById("bandReplayPlay").onclick = () => {
        if (!replayCtl) return;
        try {
          if (replayCtl._playing) replayCtl.pause();
          else replayCtl.play({ speed: Number(el("bandReplaySpeed").value) || 1 });
        } catch { /* none */ }
        replayPaint();
      };
      document.getElementById("bandReplayStop").onclick = () => stopReplay();
      document.getElementById("bandReplayRange").oninput = (e) => {
        try { replayCtl && replayCtl.seek(Number(e.target.value)); } catch { /* none */ }
        replayPaint();
      };
      document.getElementById("bandReplaySpeed").onchange = () => {
        try {
          if (replayCtl && replayCtl._playing) replayCtl.play({ speed: Number(el("bandReplaySpeed").value) || 1 });
        } catch { /* none */ }
      };
      const back = document.getElementById("bandReplayBack");
      const play = document.getElementById("bandReplayPlay");
      const step = document.getElementById("bandReplayStep");
      const stop = document.getElementById("bandReplayStop");
      back.replaceChildren(chromeIcon("step-back", 15));
      step.replaceChildren(chromeIcon("step-forward", 15));
      stop.replaceChildren(chromeIcon("stop", 15));
      play.replaceChildren(chromeIcon("play", 15));
      return panel;
    }

    function replayPaint() {
      if (!replayCtl) return;
      const bars = replayCtl._bars || [];
      const idx = Math.max(0, Math.min(bars.length - 1, Number(replayCtl._index) || 0));
      const bar = bars[idx];
      el("bandReplayRange").max = String(Math.max(0, bars.length - 1));
      el("bandReplayRange").value = String(idx);
      el("bandReplayLabel").textContent = bar && Number.isFinite(bar.time)
        ? new Date(bar.time * 1000).toLocaleString("en-IN", {
            timeZone: "Asia/Kolkata", day: "2-digit", month: "short",
            hour: "2-digit", minute: "2-digit", hour12: false,
          })
        : "—";
      const btn = el("bandReplayPlay");
      if (btn) btn.replaceChildren(chromeIcon(replayCtl._playing ? "pause" : "play", 15));
      el("bandReplay").setAttribute("aria-pressed", "true");
    }

    function startReplay() {
      const chart = activeChart();
      if (!chart) { toastMsg("No chart to replay", "err"); return; }
      if (replayCtl) { stopReplay(); return; }
      const bars = (chart.primaryBars && chart.primaryBars()) || [];
      if (bars.length < 20) {
        toastMsg("Not enough bars to replay — load more history first", "err");
        return;
      }
      const startIndex = Math.max(0, bars.length - 60);
      try {
        replayCtl = new ReplayController(chart, {
          bars,
          startIndex,
          barMs: 700,
          autoStart: true,
        });
      } catch (e) {
        replayCtl = null;
        toastMsg(`Replay unavailable: ${e.message}`, "err");
        return;
      }
      const panel = replayPanel();
      panel.hidden = false;
      replayPaint();
      if (replayTimer) clearInterval(replayTimer);
      replayTimer = setInterval(replayPaint, 300);
      toastMsg(`Replay from bar ${startIndex + 1} of ${bars.length}`, "");
    }

    function stopReplay() {
      if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
      if (replayCtl) {
        try { replayCtl.stop(); } catch { /* none */ }
        replayCtl = null;
      }
      const panel = document.getElementById("bandReplayPanel");
      if (panel) panel.hidden = true;
      el("bandReplay").setAttribute("aria-pressed", "false");
    }

    // ---- layouts / links / save / camera ---------------------------------
    function buildLayoutMenu(pop) {
      let current = null;
      try { current = brokerGrid.layout()?.preset || null; } catch { current = null; }
      pop.appendChild(popHead("Chart layout"));
      const grid = document.createElement("div");
      grid.style.display = "grid";
      grid.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
      grid.style.gap = "2px";
      const ids = Object.keys(CHART_GRID_LAYOUTS || {});
      for (const presetId of ids) {
        const def = CHART_GRID_LAYOUTS[presetId];
        const label = (CHART_GRID_LAYOUT_NAMES || {})[presetId] || presetId;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "band-pop-item" + (presetId === current ? " active" : "");
        b.title = label;
        const cells = document.createElement("span");
        cells.textContent = presetId;
        cells.style.fontVariantNumeric = "tabular-nums";
        cells.style.minWidth = "42px";
        const nm = document.createElement("span");
        nm.className = "band-pop-sub";
        nm.textContent = label;
        b.append(cells, nm);
        b.onclick = () => {
          closePops();
          try {
            brokerGrid.setPreset(presetId);
            toastMsg(`Layout: ${label}`, "ok");
          } catch (e) {
            toastMsg(`Layout failed: ${e.message}`, "err");
          }
        };
        grid.appendChild(b);
      }
      pop.appendChild(grid);
      pop.appendChild(popSep());
      pop.appendChild(
        popItem("Maximize active chart", {
          icon: chromeIcon("maximize", 16),
          onClick: () => {
            closePops();
            try {
              if (brokerGrid.maximized && brokerGrid.maximized()) brokerGrid.restore();
              else brokerGrid.maximize();
            } catch (e) { toastMsg(`Maximize failed: ${e.message}`, "err"); }
          },
        })
      );
      pop.appendChild(
        popItem("Swap active with next", {
          icon: chromeIcon("reverse", 16),
          onClick: () => {
            closePops();
            try {
              const cells = brokerGrid.cells() || [];
              const active = brokerGrid.active();
              const idx = cells.findIndex((c) => c.id === (active && active.id));
              const next = cells[(idx + 1) % cells.length];
              if (active && next && next.id !== active.id) brokerGrid.swap(active.id, next.id);
            } catch (e) { toastMsg(`Swap failed: ${e.message}`, "err"); }
          },
        })
      );
    }

    function buildLinkMenu(pop) {
      let opts = {};
      try { opts = brokerGrid.linkOptions() || {}; } catch { opts = {}; }
      const flags = [
        ["crosshair", "Crosshair"],
        ["viewport", "Time / price scale"],
        ["symbol", "Symbol"],
        ["interval", "Interval"],
        ["chartType", "Chart type"],
        ["appearance", "Appearance"],
        ["drawings", "Drawings"],
      ];
      pop.appendChild(popHead("Linked across cells"));
      for (const [key, label] of flags) {
        const row = document.createElement("label");
        row.className = "band-pop-check";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!opts[key];
        box.onchange = () => {
          const next = { ...opts, [key]: box.checked };
          try { brokerGrid.setLinks(next); } catch (e) { toastMsg(`Link failed: ${e.message}`, "err"); }
        };
        const span = document.createElement("span");
        span.textContent = label;
        row.append(box, span);
        pop.appendChild(row);
      }
      pop.appendChild(popSep());
      let groups = [];
      try { groups = brokerGrid.linkGroups() || []; } catch { groups = []; }
      if (groups.length) {
        pop.appendChild(popHead("This cell's group"));
        let cellGroup = null;
        try {
          const cell = brokerGrid.active();
          cellGroup = cell && cell.linkGroup;
        } catch { /* none */ }
        for (const g of groups) {
          pop.appendChild(
            popItem(`${g.letter || "?"} — ${g.name || g.id}`, {
              active: g.id === cellGroup,
              sub: `${(g.cells || []).length} cell${(g.cells || []).length === 1 ? "" : "s"}`,
              onClick: () => {
                closePops();
                try {
                  const cell = brokerGrid.active();
                  if (cell) brokerGrid.setLinkGroup(cell.id, g.id);
                } catch (e) {
                  toastMsg(`Group failed: ${e.message}`, "err");
                }
              },
            })
          );
        }
      }
    }

    function savedLayouts() {
      try {
        return JSON.parse(localStorage.getItem(BAND_KEY.layouts) || "{}") || {};
      } catch { return {}; }
    }

    function buildSaveMenu(pop) {
      pop.appendChild(
        popItem("Save current layout…", {
          icon: chromeIcon("save", 16),
          onClick: () => {
            closePops();
            const name = window.prompt("Layout name", `Layout ${new Date().toLocaleDateString("en-IN")}`);
            if (!name) return;
            try {
              const all = savedLayouts();
              all[name] = { savedAt: Date.now(), workspace: brokerGrid.getWorkspace() };
              localStorage.setItem(BAND_KEY.layouts, JSON.stringify(all));
              toastMsg(`Layout “${name}” saved`, "ok");
            } catch (e) {
              toastMsg(`Save failed: ${e.message}`, "err");
            }
          },
        })
      );
      const all = savedLayouts();
      const names = Object.keys(all);
      pop.appendChild(popSep());
      if (!names.length) {
        pop.appendChild(popItem("No saved layouts yet", { disabled: true }));
        return;
      }
      pop.appendChild(popHead("Saved layouts"));
      for (const name of names) {
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.gap = "2px";
        const load = popItem(name, {
          sub: all[name].savedAt ? new Date(all[name].savedAt).toLocaleDateString("en-IN") : "",
          onClick: () => {
            closePops();
            try {
              brokerGrid.applyWorkspace(all[name].workspace);
              toastMsg(`Layout “${name}” restored`, "ok");
            } catch (e) {
              toastMsg(`Restore failed: ${e.message}`, "err");
            }
          },
        });
        const del = document.createElement("button");
        del.className = "band-pop-item";
        del.type = "button";
        del.style.width = "30px";
        del.style.minHeight = "30px";
        del.title = "Delete layout";
        del.replaceChildren(chromeIcon("trash", 14));
        del.onclick = () => {
          const current = savedLayouts();
          delete current[name];
          localStorage.setItem(BAND_KEY.layouts, JSON.stringify(current));
          closePops();
          toastMsg(`Layout “${name}” deleted`, "");
        };
        row.append(load, del);
        pop.appendChild(row);
      }
    }

    function buildCamMenu(pop) {
      pop.appendChild(
        popItem("Save image (PNG)", {
          icon: chromeIcon("download", 16),
          onClick: () => {
            closePops();
            try {
              brokerGrid.downloadScreenshot();
              toastMsg("Chart snapshot downloaded", "ok");
            } catch (e) {
              toastMsg(`Snapshot failed: ${e.message}`, "err");
            }
          },
        })
      );
      pop.appendChild(
        popItem("Copy image", {
          icon: chromeIcon("copy", 16),
          onClick: async () => {
            closePops();
            try {
              const shot = await brokerGrid.takeScreenshot();
              let blob = null;
              if (typeof shot === "string") blob = await (await fetch(shot)).blob();
              else if (shot instanceof Blob) blob = shot;
              if (!blob) throw new Error("no image returned");
              await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
              toastMsg("Chart image copied", "ok");
            } catch (e) {
              toastMsg(`Copy failed: ${e.message}`, "err");
            }
          },
        })
      );
    }

    // ---- wire the band ---------------------------------------------------
    window.__bandDebug = () => ({
      state: { ...bandState },
      widget: (() => {
        const w = activeWidget();
        return w ? { symbol: w.symbol(), exchange: w.exchange(), interval: w.interval(), chartType: w.chartType() } : null;
      })(),
      tradeLayer: !!bandTradeLayer,
      tradeChart: !!bandTradeChart,
      hasTradingController: !!(activeChart() && activeChart().trading),
      replay: replayCtl ? { index: replayCtl._index, playing: replayCtl._playing, bars: (replayCtl._bars || []).length } : null,
      layout: (() => { try { return brokerGrid ? brokerGrid.layout()?.preset : null; } catch { return null; } })(),
      cells: (() => { try { return (brokerGrid.cells() || []).length; } catch { return 0; } })(),
      links: (() => { try { return brokerGrid.linkOptions(); } catch { return null; } })(),
    });
    window.__bandApply = { applyInterval, applyChartType, switchBandSymbol, startReplay, stopReplay, cycleProduct, setBandQty, toggleOneClick };

    renderTfStrip();
    hydrateGlyphs(el("band"));
    el("bandAlerts").replaceChildren(chromeIcon("bell", 15));
    el("bandDraw").replaceChildren(chromeIcon("crosshair", 15));
    el("bandLayout").replaceChildren(chromeIcon("layout", 15));
    el("bandLinks").replaceChildren(chromeIcon("link", 15));
    el("bandSave").replaceChildren(chromeIcon("folder", 15));
    el("bandCamera").replaceChildren(chromeIcon("camera", 15));
    el("bandFullscreen").replaceChildren(chromeIcon("fullscreen", 15));
    el("bandBoxSettings").replaceChildren(chromeIcon("settings", 15));

    el("bandSymbol").onclick = () => togglePop("bandSymMenu", el("bandSymbol"), buildSymMenu);
    el("bandTfMenuBtn").onclick = () => togglePop("bandTfMenu", el("bandTfMenuBtn"), buildTfMenu);
    el("bandCtype").onclick = () => togglePop("bandCtypeMenu", el("bandCtype"), buildCtypeMenu);
    el("bandDraw").onclick = () => togglePop("bandDrawMenu", el("bandDraw"), buildDrawMenu);
    el("bandLinks").onclick = () => togglePop("bandLinkMenu", el("bandLinks"), buildLinkMenu);
    el("bandSave").onclick = () => togglePop("bandSaveMenu", el("bandSave"), buildSaveMenu);
    el("bandCamera").onclick = () => togglePop("bandCamMenu", el("bandCamera"), buildCamMenu);

    el("bandBoxSettings").onclick = () => {
      const w = activeWidget();
      if (!w) return;
      try { w.openSettings(); } catch (e) { toastMsg(`Settings failed: ${e.message}`, "err"); }
    };
    el("bandIndicators").onclick = () => {
      const w = activeWidget();
      if (!w) return;
      try {
        if (typeof w.openIndicatorPicker === "function") w.openIndicatorPicker();
        else if (typeof w._openDialog === "function") w._openDialog("indicators");
      } catch (e) { toastMsg(`Indicators failed: ${e.message}`, "err"); }
    };
    el("bandAlerts").onclick = () => {
      const w = activeWidget();
      if (!w) return;
      try { w.openAlerts(); } catch (e) { toastMsg(`Alerts failed: ${e.message}`, "err"); }
    };
    el("bandReplay").onclick = () => startReplay();
    el("bandLayout").onclick = () => togglePop("bandLayoutMenu", el("bandLayout"), buildLayoutMenu);
    el("bandProduct").onclick = () => cycleProduct();
    el("bandQty").onchange = (e) => setBandQty(e.target.value);
    el("bandQty").onblur = (e) => setBandQty(e.target.value);
    el("bandOneClick").onclick = () => toggleOneClick();
    // The chain lives in the panel module's floating window (same DOM as the
    // old rail tab); the module sets `window.__oaChainToggle` at mount and
    // presses this button through `__oaChainChanged` on open/close.
    el("bandChain").addEventListener("click", () => { window.__oaChainToggle && window.__oaChainToggle(); });
    window.__oaChainChanged = (on) => {
      const btn = document.getElementById("bandChain");
      if (btn) btn.setAttribute("aria-pressed", on ? "true" : "false");
    };
    el("bandFullscreen").onclick = () => {
      const pane = document.getElementById("terminal-pane") || document.getElementById("terminal");
      if (!pane) return;
      if (document.fullscreenElement === pane) void document.exitFullscreen();
      else void pane.requestFullscreen().catch(() => {});
    };

    // The band follows whichever cell is active: a 750 ms reconcile is
    // cheaper (and far more robust) than guessing every bus event a layout
    // change emits — it also rebinds the trade layer when the cell swaps.
    setInterval(() => {
      if (!brokerGrid) return;
      try {
        paintBand();
        ensureTradeLayer();
      } catch (e) {
        console.warn("band sync", e);
      }
    }, 750);

    createBrokerGrid();
    console.log("📈 CogniX charts: openalgo-charts broker grid booting");
  </script>

  <script type="module">

    const rightPanel = mountRightPanel({

        connected: () => !!(window.__wsConnected && window.__wsConnected()),
        addChartToken: (exchange, tsym, token) => window.__addChartToken && window.__addChartToken(exchange, tsym, token),
        registerChartTokens: (symbols) => window.__registerChartTokens && window.__registerChartTokens(symbols),
        openSymbol: (tsym, exchange) => window.__openBrokerSymbol && window.__openBrokerSymbol(tsym, exchange),
        // "This chart": the active grid cell's own symbol/exchange
        // (openalgo-charts widget exposes public symbol()/exchange() getters).
        getChartContext: () => {
          try {
            const cell = window.__chartGridApi && window.__chartGridApi.active();
            const w = cell && cell.widget;
            if (w && typeof w.symbol === "function") {
              const symbol = w.symbol();
              const exchange = typeof w.exchange === "function" ? w.exchange() : "";
              if (symbol) return { symbol, exchange };
            }
          } catch { /* no grid yet */ }
          return null;
        },
      },
    });
